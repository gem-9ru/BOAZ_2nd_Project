- field_id: meta.ad.format
  summary: "형식은 광고를 사진 1장으로 낼지 여러 장 슬라이드로 낼지 정하는 칸이에요. 단일 이미지는 사진 한 장을 크게 보여 주고, 슬라이드(캐러셀)는 여러 장을 넘겨 가며 상품을 다양한 각도에서 보여 줘요. 메타는 같은 형식끼리 비교해 보라고 권해요. 사진이 1장뿐이면 단일 이미지가 가장 단순해요."
  faq:
    - q: "사진 몇 장까지 슬라이드로 할 수 있어요?"
      a: "몇 장까지 넣을 수 있는지는 화면의 안내를 따라 주세요. 슬라이드 이미지는 정사각형(1:1)이 기본이에요."
    - q: "단일 이미지랑 슬라이드 중에 뭐가 좋아요?"
      a: "어느 쪽이 좋은지는 상품마다 달라요. 첫 달은 단일 이미지로 시작하고, 한 달 뒤 결과를 보고 슬라이드로 비교해 보세요."
  keywords: [형식, 단일 이미지, 슬라이드, 캐러셀, 사진 한 장, 여러 장, 사진 여러 개, 광고 형식]
