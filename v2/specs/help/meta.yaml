- field_id: meta.ad.website_url
  summary: "웹사이트 URL은 광고를 눌렀을 때 손님이 도착할 상품 페이지 주소예요. 광고마다 이 주소 뒤에 추적용 꼬리표(URL 매개변수)를 붙일 수 있고, 꼬리표는 '&'로 이어 붙여요. 광고 설정에서 따로 넣은 꼬리표가 주소에 있던 같은 이름의 꼬리표보다 우선해요. 스토어에서 상품 한 개의 페이지 주소를 복사해서 넣으세요."
  faq:
    - q: "스토어 첫 화면 주소를 넣어도 돼요?"
      a: "가능하지만, 광고에서 본 상품 페이지로 바로 보내야 구매로 이어지기 쉬워요. 상품 페이지 주소를 권해요."
    - q: "주소 뒤에 이상한 글자가 붙어요"
      a: "코치가 어디서 온 손님인지 구분하려고 붙이는 꼬리표예요. 손님이 보는 페이지에는 영향이 없어요."
  keywords: [웹사이트 URL, 주소, 링크, 상품 주소, 상품 페이지 링크, URL, 스토어 주소, 링크 넣기]
  sources:
