- field_id: meta.ad.multi_advertiser
  summary: "여러 광고주의 광고는 내 광고가 다른 가게 광고와 한 광고 묶음 안에 같이 보이게 허용하는 기능이에요. 페이스북과 인스타그램의 일부 지면에서만 적용되고, 기존 광고에 자동으로 켜질 수 있어요. 광고 관리자의 광고 설정 단계에서 켜고 끌 수 있어요. 사진이 일부 잘려 보일 수 있으니 처음에는 끄고 시작하세요."
  faq:
    - q: "여러 광고주의 광고가 뭐예요?"
      a: "내 광고가 다른 광고주의 광고와 한 묶음에 나란히 보이는 방식이에요. 서로 관련 없는 상품일 수도 있어요."
    - q: "끄는 곳은 어디예요?"
      a: "광고 관리자에서 광고 단계의 광고 설정 화면에서 바꿀 수 있어요."
  keywords: [여러 광고주, 다른 광고와 같이, 묶음 광고, 멀티 광고주, 같이 보이는 광고]
  sources:
