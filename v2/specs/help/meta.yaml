  checked: "2026-11-16"

- field_id: meta.ad.pixel
  summary: "메타 픽셀은 내 웹사이트에 다는 작은 코드로, 광고를 본 손님이 사이트에서 무엇을 했는지(페이지 조회, 구매 등)를 메타에 알려 줘요. 코드를 사이트 소스에 넣을 수 있어야 하고, 설치 후 이벤트 관리자에서 페이지 조회가 잡히는지 확인해요. 스마트스토어에 픽셀을 달 수 있는지는 메타가 아닌 스토어 쪽 안내를 확인해야 해요(메타 쪽 안내만으로는 알 수 없어요). 달 수 없다면 메타 결과표의 '구매'는 비고, 판매는 스토어 주문으로 확인해요."
  faq:
    - q: "픽셀이 뭐예요?"
      a: "내 사이트에 다는 추적 코드예요. 광고를 본 사람이 사이트에서 한 행동을 메타가 배우는 데 쓰여요."
    - q: "픽셀 없이도 광고 낼 수 있어요?"
      a: "네, 낼 수 있어요. 다만 메타 결과표의 구매 숫자가 비어서 판매는 스토어 주문으로 따로 확인해야 해요."
    - q: "설치가 됐는지 어떻게 알아요?"
      a: "이벤트 관리자에서 페이지 조회 이벤트가 들어오는지 보면 돼요. 크롬 확장 프로그램으로도 점검할 수 있어요."
  keywords: [픽셀, 메타 픽셀, 추적 코드, 구매 추적, 웹사이트 이벤트, 설치, 스마트스토어 픽셀, 전환 추적]
  sources:
