    - {title: "Tips For Improving A/B Tests", url: "https://www.facebook.com/business/help/135668260430624"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.ad.language
  summary: "언어(자동 번역)는 광고 문구를 다른 언어로 번역해서 보여 주는 기능이에요. 광고 관리자에서 언어별 문구를 직접 넣거나 번역 버튼으로 자동 번역을 쓸 수 있고, 번역된 광고에는 '자동 번역됨' 표시가 붙어요. 메타는 번역 품질을 보장하지 않아서 번역된 글을 꼭 검토하라고 해요. 국내 손님만 대상이면 필요 없으니 끄세요."
  faq:
    - q: "자동 번역을 켜면 뭐가 달라요?"
      a: "다른 언어를 쓰는 손님에게 번역된 문구가 보여요. 국내 손님만 대상이면 달라지는 게 없어요."
    - q: "번역이 이상하면요?"
      a: "메타도 번역 품질을 보장하지 않는다고 안내해요. 직접 검토하거나 끄는 게 안전해요."
  keywords: [언어, 자동 번역, 번역, 영어, 외국어, 다국어, 해외 손님]
