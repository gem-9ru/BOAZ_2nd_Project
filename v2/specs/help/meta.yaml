    - {title: "Use URL Tags for Tracking (Marketing API)", url: "https://developers.facebook.com/documentation/ads-commerce/instagram/ads-api/guides/url-tags-for-tracking"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.ad.tracking_url
  summary: "URL 매개변수는 웹사이트 주소 뒤에 붙이는 꼬리표로, 어떤 광고에서 온 손님인지 통계에서 구분하게 해 줘요. 메타 광고 관리자에서는 광고 이름이나 캠페인 이름 같은 값을 자동으로 채우는 동적 매개변수도 쓸 수 있어요. 메타의 안내는 출처를 facebook, 유형을 cpc 같은 규칙으로 일관되게 쓰라고 해요. 스마트스토어에서 쓰는 NT 꼬리표는 네이버 쪽 방식이라 메타 안내와는 달라요."
  faq:
    - q: "꼬리표(UTM)가 뭐예요?"
      a: "주소 뒤에 붙는 '출처=메타' 같은 표시예요. 스토어 통계에서 메타로 온 손님을 구분할 수 있어요."
    - q: "꼬리표 값이 매번 달라져도 돼요?"
      a: "달라지면 통계가 흩어져서 비교가 어려워요. 일관되게 쓰는 게 좋다고 메타도 안내해요."
  keywords: [URL 매개변수, 추적, 꼬리표, UTM, 파라미터, 추적 링크, 어디서 왔는지, NT]
  sources:
