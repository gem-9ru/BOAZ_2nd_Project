- field_id: meta.ad.partnership
  summary: "파트너십 광고는 다른 크리에이터나 브랜드의 인스타그램 계정 이름으로 내는 광고예요. 크리에이터가 만든 광고 코드를 받아 쓰거나, 유료 파트너십 라벨이 붙은 게시물을 광고로 키울 수 있어요. 광고는 크리에이터 계정 프로필에는 나타나지 않아요. 협업하는 크리에이터가 없다면 끈 채로 두세요."
  faq:
    - q: "파트너십 광고가 뭐예요?"
      a: "크리에이터의 계정으로 내 상품을 소개하는 광고예요. 크리에이터와 먼저 협업이 되어 있어야 해요."
    - q: "혼자 운영하면 필요해요?"
      a: "아니요. 협업 상대가 없다면 끈 채로 두면 돼요."
