- field_id: meta.ad.creative_test
  summary: "크리에이티브 테스트는 사진이나 문구가 다른 광고 몇 개를 겨뤄 보는 기능이에요. 메타는 한 번에 한 가지만 바꿔야 결과를 믿을 수 있다고 안내하고, 광고 세트나 캠페인을 직접 껐다 켜는 식의 비공식 비교는 권하지 않아요. 정식 비교는 A/B 테스트 도구로 하면 같은 사람에게 두 안이 겹쳐 보이지 않게 나뉘어요. 클릭률이 낮게 나올 때 사진 2~3개를 비교하세요."
  faq:
    - q: "사진을 두 개 올려서 비교해도 돼요?"
      a: "가능하지만 메타는 공정한 비교를 위해 A/B 테스트 도구를 쓰라고 권해요. 한 번에 한 가지만 다르게 하세요."
    - q: "언제부터 하면 좋아요?"
      a: "첫 달 결과로 기준이 생긴 뒤에요. 클릭률이 낮을 때 사진을 바꿔 비교해 보세요."
  keywords: [크리에이티브 테스트, 소재 테스트, 사진 테스트, 사진 비교, 광고 비교, 어느 사진이 나아요, 테스트]
  sources:
