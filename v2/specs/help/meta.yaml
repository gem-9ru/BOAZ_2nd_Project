# 메타 광고 관리자 칸별 도움말 (트래픽 목표 기준) — 공식 자료 조사 2026-11-16
# 근거: 메타 비즈니스 도움말 센터(facebook.com/business/help), Meta for Business, Meta 개발자 문서.
# check: ✅ 공식에서 확인 / △ 공식에서 못 찾아 다른 자료 / ❓ 확인 못 함 (칸 사양의 주장 중 핵심을 못 찾은 경우 포함)
# 메모: 일부 도움말 센터 페이지는 본문이 스크립트로 그려져서, 요약은 검색 결과에 실린 해당 공식 페이지 내용과 직접 열어 본 공식 페이지(가격 안내, 개발자 예산 문서)에 근거함.

# ── 사전 점검 ──
- field_id: meta.pre.fb_page
  summary: "인스타그램에 광고를 내려면 광고에 얼굴이 될 계정이 필요해요. 보통은 페이스북 페이지와 인스타그램 프로필을 연결해서 쓰고, 인스타그램 계정이 없으면 페이스북 페이지로 대신 광고를 낼 수도 있어요. 메타 안내 중에는 광고 계정과 페이지가 필요하다고 적힌 곳도 있어서, 페이지를 하나 만들어 두는 게 가장 안전해요. 페이지는 무료로 만들 수 있고 몇 분이면 끝나요."
  faq:
    - q: "인스타그램만 쓰는데 페이스북 페이지가 꼭 있어야 해요?"
      a: "메타 공식 안내상 인스타그램 광고에는 인스타그램 계정이 필요하고, 계정이 없으면 페이스북 페이지를 대신 쓸 수 있어요. 광고 관리자 설정이 페이지를 요구하는 경우가 많으니 페이지를 만들어 두고 인스타그램과 연결해 두세요."
    - q: "페이스북 페이지는 어떻게 만들어요?"
      a: "페이스북에서 '페이지 만들기'를 눌러 가게 이름과 분류만 넣으면 돼요. 무료이고, 만든 뒤 인스타그램 프로필과 연결할 수 있어요."
  keywords: [페이스북 페이지, 페이지, 페북, 페이지 없어요, 페이지 만들기, 대표 계정, 인스타만, 인스타그램만 써요, 광고 계정]
  sources:
    - {title: "Run ads on Instagram with your Facebook Page", url: "https://www.facebook.com/business/help/272348126756182"}
    - {title: "About Instagram Account Requirements", url: "https://www.facebook.com/business/help/910175409024706"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.pre.ig_account
  summary: "광고에 보일 인스타그램 계정을 고르는 칸이에요. 광고를 내려면 전문가 계정(비즈니스 또는 크리에이터)이어야 하고, 페이스북 페이지와 연결해 두면 한 곳에서 관리할 수 있어요. 개인 계정과 가게 계정이 따로 있다면 가게 계정 이름을 적어 주세요. 계정을 연결하면 페이지나 인스타그램에 접근 권한이 있는 사람이 둘 다 관리할 수 있다는 점도 알아 두세요."
  faq:
    - q: "개인 계정인데 광고 낼 수 있어요?"
      a: "메타 안내상 광고에 쓰려면 전문가(비즈니스·크리에이터) 계정으로 바꾸고 페이지와 연결하는 게 기본이에요. 인스타그램 프로필의 '프로필 편집'에서 페이지를 연결할 수 있어요."
    - q: "인스타 계정 연결은 어디서 해요?"
      a: "인스타그램 프로필 편집 화면의 '페이지' 항목, 또는 페이스북 페이지 설정의 '연결된 계정'에서 할 수 있어요."
  keywords: [인스타그램 계정, 인스타 계정, 인스타 아이디, 계정 이름, 가게 계정, 프로필, 비즈니스 계정, 전문가 계정, 연결]
  sources:
    - {title: "Connect or disconnect your professional Instagram account and a Facebook Page", url: "https://www.facebook.com/business/help/898752960195806"}
    - {title: "About Instagram Account Requirements", url: "https://www.facebook.com/business/help/910175409024706"}
  check: "✅"
  checked: "2026-11-16"

# ── 캠페인 ──
- field_id: meta.campaign.name
  summary: "캠페인 이름은 광고를 나중에 찾고 결과를 구분하려고 붙이는 이름이에요. 손님에게는 보이지 않아요. 코치가 '상품_목표_월' 모양으로 자동으로 만들어 주니 따로 고민하지 않아도 돼요. 광고 관리자에는 이름 규칙을 저장해 두는 '이름 템플릿' 기능도 있어서, 나중에 이름을 바꾸거나 규칙을 쓸 수 있어요."
  faq:
    - q: "캠페인 이름 나중에 바꿔도 돼요?"
      a: "네, 광고 관리자에서 캠페인을 선택하고 편집을 누르면 이름을 바꿀 수 있어요. 손님에게 보이는 이름이 아니라 광고 성과에는 영향이 없어요."
    - q: "이름을 어떻게 지어야 해요?"
      a: "무슨 상품을 어떤 목표로 언제 냈는지 알 수 있게 짓는 게 좋아요. 코치가 자동으로 만들어 주니 그대로 쓰시면 돼요."
  keywords: [캠페인 이름, 이름, 이름 짓기, 이름 규칙, 이름 바꾸기, 네이밍]
  sources:
    - {title: "Apply a Name Template in Ads Manager", url: "https://www.facebook.com/business/help/464973704306306"}
    - {title: "How to Edit Ad Campaigns in Meta Ads Manager", url: "https://www.facebook.com/business/help/2169779963333459"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.campaign.buying_type
  summary: "구매 유형은 광고가 어떤 방식으로 노출되는지 정하는 칸이에요. '경매'는 다른 광고주와 경쟁해서 노출되는 기본 방식이고, 소액 광고는 거의 이 방식이에요. 노출을 미리 예약하는 '도달 및 빈도' 방식은 브랜드 알리기용이고, 신청해서 허가받은 광고주만 쓸 수 있어요. 그래서 초보 판매자는 '경매' 그대로 두면 돼요."
  faq:
    - q: "경매가 뭐예요? 돈을 더 내야 해요?"
      a: "광고가 보일 자리를 놓고 다른 광고와 경쟁하는 방식이에요. 입찰 금액을 직접 정하지 않아도 되고, 내가 정한 예산 안에서 쓰여요."
    - q: "구매 유형을 도달 및 빈도로 바꿀 수 있어요?"
      a: "메타 안내상 도달 및 빈도(예약형)는 모든 광고주에게 열려 있지 않고, 브랜드 인지도 목적에 맞는 방식이에요. 클릭이나 방문이 목표라면 경매가 맞아요."
  keywords: [구매 유형, 경매, 예약, 도달 및 빈도, 입찰 방식, 경매가 뭐예요]
  sources:
    - {title: "What's reach and frequency buying?", url: "https://en-gb.facebook.com/business/help/251123081984768"}
    - {title: "Reservation (Marketing API)", url: "https://developers.facebook.com/documentation/ads-commerce/marketing-api/reservation"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.campaign.objective
  summary: "캠페인 목표는 광고로 얻고 싶은 큰 결과를 고르는 칸이에요. 메타는 인지도, 트래픽, 참여, 잠재 고객, 앱 홍보, 판매의 6가지로 나눠요. 스토어에 손님이 와서 보게 하고 싶으면 '트래픽'을, 가게를 많은 사람에게 알리고 싶으면 '인지도'를 고르세요. 코치의 첫 달 기본은 '스토어 방문 늘리기(트래픽)'이고, 판매는 스토어 주문으로 직접 확인해요."
  faq:
    - q: "트래픽이랑 판매 중에 뭘 골라야 해요?"
      a: "트래픽은 링크를 눌러 스토어로 오는 사람을 늘리는 목표이고, 판매는 구매할 가능성이 높은 사람을 찾는 목표예요. 메타가 구매 기록을 배워야 판매 목표가 잘 돌아가서, 첫 달은 트래픽으로 시작하는 걸 권해요."
    - q: "인지도는 언제 써요?"
      a: "아직 가게를 모르는 사람에게 많이 보이고 기억되게 하고 싶을 때 써요. 클릭이나 방문 숫자를 늘리는 목표는 아니에요."
  keywords: [캠페인 목표, 목표, 트래픽, 인지도, 판매, 참여, 방문 늘리기, 가게 알리기, 어떤 목표, 목표 고르기]
  sources:
    - {title: "How to choose the right ad objective in Meta Ads Manager", url: "https://www.facebook.com/business/help/1438417719786914"}
    - {title: "Traffic Ad Objective", url: "https://www.facebook.com/business/ads/ad-objectives/traffic"}
    - {title: "Simplifying campaign objectives with Outcome-Driven Ad Experiences", url: "https://developers.facebook.com/blog/post/2021/12/21/simplifying-campaign-objectives-outcome-driven-ad-experiences"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.campaign.special_category
  summary: "특별 광고 카테고리는 신용·고용·주택, 사회 이슈·선거·정치처럼 민감한 주제의 광고인지 알리는 칸이에요. 신용·고용·주택 광고는 나이·성별·세부 관심사 같은 타겟 선택이 제한돼요. 사회 이슈·선거·정치 광고는 타겟 제한보다 광고주 승인(인증)이 필요해요. 디저트나 생활용품은 해당하지 않으니 '아니요'를 고르면 돼요."
  faq:
    - q: "베이커리도 특별 광고 카테고리인가요?"
      a: "아니에요. 음식, 생활용품 같은 일반 상품은 해당하지 않아서 '아니요'를 고르면 돼요."
    - q: "해당하면 어떻게 되나요?"
      a: "신용·고용·주택 광고는 나이 범위가 고정되고 일부 타겟 옵션을 쓸 수 없어요. 선거·정치 광고는 메타의 광고주 승인을 먼저 받아야 해요."
  keywords: [특별 광고 카테고리, 특별 카테고리, 금융, 대출, 고용, 주택, 정치, 선거, 사회 이슈, 제한, 해당 안 돼요]
  sources:
    - {title: "Special Ad Categories (Marketing API)", url: "https://developers.facebook.com/documentation/ads-commerce/marketing-api/audiences/special-ad-category"}
    - {title: "Introduction to the Advertising Standards", url: "https://transparency.meta.com/policies/ad-standards/"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.campaign.budget_strategy
  summary: "예산을 캠페인 하나로 묶을지, 광고 세트마다 따로 정할지 고르는 칸이에요. 캠페인 예산(어드밴티지+ 캠페인 예산)은 메타가 여러 광고 세트 사이에서 실시간으로 예산을 옮겨 주고, 광고 세트 예산은 세트마다 내가 직접 정해요. 첫 달처럼 광고 세트가 1개면 두 방식의 차이가 없어요. 타겟을 여러 개 비교할 때 바꿔 보세요."
  faq:
    - q: "캠페인 예산이랑 광고 세트 예산 중 뭐가 좋아요?"
      a: "세트가 1개면 같아요. 여러 세트를 메타가 알아서 배분하게 하고 싶으면 캠페인 예산, 세트별로 내가 정하고 싶으면 광고 세트 예산이에요."
    - q: "나중에 바꿀 수 있어요?"
      a: "네. 다만 예산을 크게 바꾸면 메타가 다시 학습하는 기간이 생길 수 있어요."
  keywords: [예산 전략, 캠페인 예산, 광고 세트 예산, 예산 방식, 예산 나누기, cbo, 어드밴티지 캠페인 예산]
  sources:
    - {title: "About Campaign Budget Optimization", url: "https://www.facebook.com/business/help/773289396357218"}
    - {title: "Meta Advantage+ Campaign Budget", url: "https://www.facebook.com/business/ads/meta-advantage-plus/budget"}
    - {title: "About budgets", url: "https://en-gb.facebook.com/business/help/214319341922580"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.campaign.budget_share
  summary: "'예산 공유' 칸은 같은 캠페인 안의 광고 세트끼리 예산 일부를 옮겨 쓰게 하는 기능이에요. 광고 세트 하나의 예산 중 최대 20%까지 다른 세트로 옮겨 쓸 수 있다고 알려져 있어요. 전체 지출이 늘어나는 기능은 아니고, 광고 세트가 1개면 옮길 곳이 없어서 효과가 없어요. 처음에는 그대로 두세요."
  faq:
    - q: "예산 공유를 켜면 돈이 더 나가요?"
      a: "아니에요. 총예산은 그대로이고 세트 사이에서 나눠 쓰는 방식만 달라져요. 세트가 하나뿐이면 켜도 달라지는 게 없어요."
    - q: "이거 꼭 켜야 해요?"
      a: "아니요. 광고 세트가 여러 개일 때만 의미가 있어요. 첫 달은 그대로 두세요."
  keywords: [예산 공유, 20%, 예산 옮기기, 세트끼리, 예산 최대 20, 공유]
  sources:
    - {title: "About Ad Set Budget Sharing", url: "https://www.facebook.com/business/help/1388266028979935"}
  check: "❓"
  checked: "2026-11-16"

- field_id: meta.campaign.bid_strategy
  summary: "입찰 전략은 예산을 어떻게 써서 결과를 얻을지 정하는 칸이에요. '최고 볼륨'은 정해 둔 예산 안에서 결과(여기서는 방문)를 최대한 많이 받는 방식이고, 목표 비용을 정하지 않으면 메타가 기본으로 이 방식을 써요. '결과당 비용 목표'나 '입찰 한도'는 평균 비용 기준을 알고 있을 때 쓰는 방식이라, 첫 달은 최고 볼륨이 맞아요. 한 달 뒤 비용이 오르면 그때 바꿔 봐요."
  faq:
    - q: "최고 볼륨으로 하면 비용이 많이 나와요?"
      a: "비용 상한 없이 최대한 많은 결과를 찾는 방식이라, 결과당 비용이 오르내릴 수 있어요. 예산은 정한 만큼만 쓰여요."
    - q: "입찰 한도는 언제 써요?"
      a: "경매마다 최대 입찰가를 직접 정하는 방식이에요. 전환율을 예측해서 입찰가를 계산할 수 있는 광고주용이고, 너무 낮게 정하면 광고가 잘 안 나가요."
  keywords: [입찰 전략, 입찰, 최고 볼륨, 입찰 한도, 비용 한도, 입찰가, 최저 비용, 클릭 비용 올라요]
  sources:
    - {title: "About Meta bid strategies", url: "https://en-gb.facebook.com/business/help/1619591734742116"}
    - {title: "About cost per result goal", url: "https://en-gb.facebook.com/business/help/272336376749096"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.campaign.ab_test
  summary: "A/B 테스트는 두 가지 안(예: 사진 A와 B)을 같은 조건에서 나눠 보여 주고 어느 쪽이 더 좋은지 비교하는 기능이에요. 메타는 같은 사람에게 두 안이 모두 보이지 않게 나눠 줘요. 한 번에 한 가지(사진만 또는 문구만)만 바꿔야 결과를 믿을 수 있고, 예산은 두 안에 똑같이 주는 걸 권해요. 첫 달은 비교 기준이 없으니 끄고, 한 달 뒤 사진을 비교할 때 켜요."
  faq:
    - q: "A/B 테스트가 뭐예요?"
      a: "사진 두 장처럼 두 가지를 공정하게 겨뤄 보는 기능이에요. 겹치지 않는 사람들에게 각각 보여 줘서 더 잘 나온 쪽을 알려 줘요."
    - q: "소액인데 해도 돼요?"
      a: "예산이 너무 적으면 결과 차이를 믿기 어려워요. 첫 달은 끄고 기본 결과를 본 뒤에 하세요."
