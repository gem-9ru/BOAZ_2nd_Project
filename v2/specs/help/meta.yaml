- field_id: meta.adset.live
  summary: "라이브 방송 광고는 진행 중이거나 끝난 페이스북 라이브를 광고로 홍보하는 기능이에요. 일반 영상 광고처럼 보이고 화면에 '라이브' 표시가 붙어요. 예약해 둔 라이브는 방송이 시작된 뒤에야 광고로 키울 수 있고, 방송 중 광고는 모든 광고주에게 열려 있지 않아요. 라이브를 하지 않는다면 끈 채로 두면 돼요."
  faq:
    - q: "라이브를 안 하는데 켜야 해요?"
      a: "아니에요. 라이브 방송을 홍보할 때만 쓰는 설정이라 끈 채로 두면 돼요."
    - q: "라이브 광고는 어디에 나와요?"
      a: "방송 중에 키운 광고는 페이스북 피드에만 나오고, 방송이 끝난 뒤에는 모든 노출 위치에 낼 수 있다고 메타가 안내해요."
  keywords: [라이브, 라이브 방송, 라이브 광고, 인스타 라이브, 실시간 방송, 방송 홍보]
  sources:
