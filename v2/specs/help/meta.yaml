    - {title: "Ad Set (Marketing API) optimization_goal", url: "https://developers.facebook.com/documentation/ads-commerce/marketing-api/reference/ad-campaign"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.adset.attribution_model
  summary: "기여 설정은 광고 덕분에 생긴 결과를 며칠 안의 클릭이나 조회까지 광고 몫으로 셀지 정하는 칸이에요. 메타 공식 안내에는 '1일 클릭', '7일 클릭', '1일 클릭 또는 1일 조회', '7일 클릭 또는 1일 조회' 같은 기간 설정이 있고, 이 설정으로 메타가 학습할 결과가 정해져요. 화면에 '일반'과 '증대' 선택지가 보여도 처음에는 건드리지 않아도 돼요. 초보 판매자는 기본값을 그대로 두고, 판매는 스토어 주문으로 따로 확인하세요."
  faq:
    - q: "기여 모델이 뭐예요?"
      a: "광고를 보거나 누른 뒤 며칠 안에 생긴 결과를 광고 덕분으로 셀지 정하는 규칙이에요. 기간이 길수록 광고 몫으로 세는 결과가 늘어나요."
    - q: "증대를 고르면 안 돼요?"
      a: "트래픽 목표에서는 증대를 못 고르는 경우가 많아요. 선택지가 안 보이면 기본값을 쓰면 돼요."
  keywords: [기여 모델, 기여 설정, 기여 기간, 증대, 일반, 7일 클릭, 1일 조회, 어트리뷰션]
  sources:
    - {title: "About the attribution setting", url: "https://en-gb.facebook.com/business/help/460276478298895"}
    - {title: "Change Your Attribution Window for Ad Results in Ads Manager", url: "https://www.facebook.com/business/help/304909959680406"}
  check: "❓"
  checked: "2026-11-16"

- field_id: meta.adset.cost_goal
  summary: "결과당 비용 목표는 방문 한 번에 평균 얼마까지 쓰고 싶은지 정하는 칸이에요. 메타는 이 평균에 맞추려고 입찰하지만 목표를 보장하지는 않고, 평균이 목표를 넘을 수도 있어요. 목표를 비워 두면 메타가 '최고 볼륨' 방식으로 가장 많은 결과를 찾아요. 첫 달 평균을 모르는 상태에서 정하면 광고가 잘 안 나가거나 비효율적일 수 있어서 비워 두고 시작해요."
  faq:
    - q: "결과당 비용 목표 안 넣어도 돼요?"
      a: "네, 비워 두면 메타가 예산 안에서 최대한 많은 결과를 찾아요. 첫 달 평균 비용을 본 뒤에 정하는 게 좋아요."
    - q: "목표를 정하면 그 비용으로 딱 맞춰져요?"
      a: "아니에요. 목표 근처로 맞추려는 목표일 뿐이고 평균 비용이 더 나올 수도 있어요. 너무 낮게 정하면 노출이 줄 수 있어요."
  keywords: [결과당 비용 목표, 비용 목표, 클릭당 비용, 방문당 비용, 한 번에 얼마, 목표 비용, 코스트 캡]
  sources:
