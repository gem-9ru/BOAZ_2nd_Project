- field_id: meta.adset.conversion_location
  summary: "전환 위치는 손님이 광고를 눌렀을 때 어디에서 행동하길 바라는지 정하는 칸이에요. 트래픽 목표에서는 웹사이트, 앱, 인스타그램 프로필 같은 곳으로 보낼 수 있어요. 스토어 상품 페이지로 보내면 한 달 뒤 스토어 주문 숫자로 결과를 확인할 수 있어서, 첫 달에는 상품 페이지가 가장 좋아요. 인스타그램 프로필이나 DM은 주문을 따로 세어야 해서 비교가 어려워요."
  faq:
    - q: "광고 누르면 인스타 프로필로 보내도 돼요?"
      a: "가능하지만 주문이 스토어에서 일어나면 방문과 주문을 연결해서 보기 어려워요. 스토어 상품 페이지로 보내는 걸 권해요."
    - q: "전환 위치가 뭐예요?"
      a: "광고를 본 사람이 구매나 방문 같은 행동을 하는 장소예요. 웹사이트, 앱, 메시지 등이 있어요."
  keywords: [전환 위치, 어디로 보내, 어디로 가, 링크 연결, 웹사이트, 프로필, DM, 메시지, 랜딩, 도착 페이지]
  sources:
