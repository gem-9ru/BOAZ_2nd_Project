    - {title: "About Meta bid strategies", url: "https://en-gb.facebook.com/business/help/1619591734742116"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.adset.value_rules
  summary: "가치 조정(규칙 세트)은 특정 연령대나 노출 위치의 손님에게 입찰을 더 높이거나 낮춰서 우선순위를 조절하는 기능이에요. 메타 개발자 문서에는 나이·노출 위치 기준으로 입찰을 올리거나(최대 1000%) 내릴(최대 90%) 수 있다고 나와 있어요. 우선하는 그룹의 결과가 늘 수 있는 대신 전체 결과당 비용이 오를 수 있다고 메타가 경고해요. 어느 그룹이 잘되는지 확인된 뒤에 쓰는 기능이라 첫 달은 비워 둬요."
  faq:
    - q: "가치 조정을 안 하면 손해예요?"
      a: "아니에요. 어느 연령이나 위치가 잘되는지 모르는 첫 달에는 쓸 근거가 없어요. 한 달 결과로 잘되는 그룹이 보이면 그때 써요."
    - q: "쓰면 비용이 줄어요?"
      a: "메타 안내상 선호하는 그룹의 결과는 늘 수 있지만 전체 결과당 비용은 오를 수 있어요."
  keywords: [가치 조정, 규칙 세트, 가치 규칙, 연령별 입찰, 위치별 입찰, 우선순위, 입찰 조정]
  sources:
    - {title: "Value Rules (Marketing API)", url: "https://developers.facebook.com/documentation/ads-commerce/marketing-api/bidding/value-rules.md"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.adset.delivery_type
  summary: "게재 유형은 예산을 얼마나 빠르게 쓸지 정하는 칸이에요. '일반(표준) 게재'는 하루 동안 입찰을 조절해 예산을 고르게 쓰는 기본 방식이에요. '빠른(가속) 게재'는 이 조절을 끄고 가능한 경매에 모두 들어가서, 하루가 끝나기 전에 예산이 다 쓰일 수 있어요. 메타는 반짝 세일이나 라이브 행사처럼 짧은 기간에 몰아서 보여 줄 때 쓰라고 안내해요. 어드밴티지+ 캠페인 예산을 쓰려면 일반 게재여야 해요."
  faq:
    - q: "가속 게재가 더 빨리 팔리나요?"
      a: "광고가 더 빨리 많이 나가고 예산도 빨리 쓰일 뿐, 주문이 더 들어온다는 보장은 없어요. 입찰가가 낮거나 타겟이 좁아서 노출이 적을 때는 도움이 안 된다고 메타가 안내해요."
    - q: "일반 게재는 하루 예산을 다 쓰나요?"
      a: "하루 동안 나눠 쓰는 방식이에요. 하루 예산은 평균 목표라서 날마다 조금 많거나 적게 쓰일 수 있어요."
  keywords: [게재 유형, 일반 게재, 표준 게재, 가속 게재, 빠른 게재, 빨리 쓰기, 예산 빨리 소진, 예산 분배]
  sources:
    - {title: "Pacing and Scheduling (Marketing API)", url: "https://developers.facebook.com/documentation/ads-commerce/marketing-api/bidding/overview/pacing-and-scheduling"}
    - {title: "Meta Advantage+ Campaign Budget", url: "https://www.facebook.com/business/ads/meta-advantage-plus/budget"}
    - {title: "Budgets (Marketing API)", url: "https://developers.facebook.com/documentation/ads-commerce/marketing-api/bidding/overview/budgets.md"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.adset.dynamic_creative
  summary: "다이내믹 크리에이티브는 사진, 제목, 문구를 여러 개 올리면 메타가 조합을 바꿔 가며 보여 주고 잘 먹히는 조합을 찾아 주는 기능이에요. 문구와 제목은 각각 최대 5개까지 넣을 수 있어요. 어떤 조합이 좋았는지 알 수 있는 대신 내가 조합을 통제하기는 어려워요. 사진과 문구가 여러 개 준비된 뒤에 켜세요."
  faq:
    - q: "다이내믹 크리에이티브 켜면 뭐가 좋아요?"
      a: "여러 사진과 문구를 섞어 보여 주고 반응이 좋은 조합을 메타가 찾아 줘요. 사진이 1장뿐이면 효과가 작아요."
    - q: "문구는 몇 개까지 넣을 수 있어요?"
      a: "문구 5개, 원하면 제목과 설명도 각각 5개까지 넣을 수 있어요."
  keywords: [다이내믹 크리에이티브, 다이나믹, 조합, 사진 여러 장 섞기, 문구 여러 개, 자동 조합, 자동으로 섞어]
  sources:
