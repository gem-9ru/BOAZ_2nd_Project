  checked: "2026-11-16"

- field_id: meta.adset.performance_goal
  summary: "성과 목표는 메타가 어떤 행동을 한 사람을 더 찾아 줄지 정하는 칸이에요. '랜딩 페이지 조회수'는 링크를 누른 뒤 페이지가 실제로 열린 사람을 늘리는 방식이고, '링크 클릭'은 누르기만 해도 세요. 메타는 특정 페이지로 보낼 때 랜딩 페이지 조회 쪽을 권해요. 다만 공식 안내상 랜딩 페이지 조회 집계에는 메타 픽셀이 필요하다고 되어 있어서, 픽셀을 달 수 없는 스토어라면 선택이 안 되거나 숫자가 비어 있을 수 있어요. 그땐 링크 클릭 극대화를 고르세요."
  faq:
    - q: "랜딩 페이지 조회수랑 링크 클릭이 뭐가 달라요?"
      a: "링크 클릭은 광고를 누른 횟수, 랜딩 페이지 조회는 누른 뒤 페이지가 열린 횟수예요. 실수로 눌렀거나 페이지가 안 열린 경우는 조회에서 빠져서 조회 쪽이 더 믿을 만해요."
    - q: "랜딩 페이지 조회 목표가 선택이 안 돼요"
      a: "메타는 랜딩 페이지 조회를 세려면 메타 픽셀이 필요하다고 안내해요. 픽셀을 달 수 없다면 링크 클릭 극대화를 고르면 돼요."
  keywords: [성과 목표, 랜딩 페이지 조회, 랜딩페이지, 링크 클릭, 클릭 극대화, 조회수, 선택이 안 돼요, 최적화]
  sources:
