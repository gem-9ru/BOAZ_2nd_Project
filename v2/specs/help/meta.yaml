    - {title: "Create a live video ad from Meta Ads Manager", url: "https://www.facebook.com/business/help/268170920933673"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.adset.daily_budget
  summary: "일일 예산은 하루에 평균 얼마를 쓰고 싶은지 메타에 알려 주는 금액이에요. 코치가 메타 몫의 예산을 광고 기간으로 나눠 넣어 줘요. 메타는 기회가 좋은 날 하루 예산보다 더 쓸 수 있고, 한 주(일~토) 합계는 하루 예산의 7배를 넘지 않게 맞춰요. 하루에는 정해 둔 예산보다 최대 75% 더 쓸 수 있어요(하루 예산 1만 원이면 최대 1만 7,500원). 그래서 하루 숫자보다 한 주 합계로 보는 게 안전해요. 예전 문서에는 25%로 적힌 곳도 있는데, 메타가 이 범위를 75%로 넓혔어요."
  faq:
    - q: "하루 예산보다 돈이 더 나갈 수 있어요?"
      a: "네, 메타는 기회가 좋은 날 하루 예산보다 최대 75% 더 쓸 수 있어요. 대신 한 주 합계는 하루 예산 곱하기 7을 넘지 않게 맞춰요."
    - q: "최소 얼마부터 광고할 수 있어요?"
      a: "메타 가격 안내는 학습을 위해 최소 7일 동안 쓸 수 있는 예산을 권해요. 정해진 최소 금액은 통화와 계정에 따라 달라요."
    - q: "일일 예산이 이상해요"
      a: "코치가 이번 달 메타 몫을 광고 기간으로 나눈 값이에요. 기간을 바꾸면 하루 금액도 달라져요."
  keywords: [일일 예산, 하루 예산, 하루 얼마, 예산 초과, 더 나가요, 예산 넘게, 하루 최대, 일 예산]
  sources:
    - {title: "Facebook and Instagram Ads Pricing & Cost: An Overview", url: "https://www.facebook.com/business/ads/pricing"}
    - {title: "About Daily Budgets", url: "https://www.facebook.com/business/help/190490051321426"}
    - {title: "Budgets (Marketing API)", url: "https://developers.facebook.com/documentation/ads-commerce/marketing-api/bidding/overview/budgets.md"}
    - {title: "Graph API Changelog Version 24.0", url: "https://developers.facebook.com/docs/graph-api/changelog/version24.0"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.adset.end_date
  summary: "종료 날짜는 광고가 언제까지 나갈지 정하는 칸이에요. 하루 예산을 쓰면 종료일을 넣지 않고 계속 실행할 수도 있는데, 그러면 직접 끌 때까지 광고가 계속 나가요. 종료일이 지나면 광고는 '완료'되어 더 나가지 않아요. 메타 가격 안내는 학습을 위해 최소 7일 동안의 예산을 권해요. 그래서 소액 광고는 7~14일처럼 끝나는 날을 정해 두는 게 안전해요."
  faq:
    - q: "종료일 안 넣으면 어떻게 돼요?"
      a: "계속 실행으로 설정되어 있으면 직접 끄기 전까지 광고와 비용이 계속돼요. 소액이면 종료일을 넣어 두는 게 안전해요."
    - q: "종료일이 지난 광고를 다시 쓰려면요?"
      a: "광고 세트를 편집해서 종료일을 미래 날짜로 바꾸거나 계속 실행으로 바꾸면 돼요."
    - q: "며칠이 좋아요?"
      a: "메타는 최소 7일 이상을 권해요. 이 칸의 기본은 14일이고, 예산과 목표에 맞춰 7·14·30일 중에서 고르세요."
  keywords: [종료 날짜, 종료일, 끝나는 날, 언제까지, 기간, 며칠, 광고 기간, 계속 나가요, 끄는 법]
  sources:
    - {title: "End Date Is In the Past / Your Ad Set Schedule Has Ended", url: "https://www.facebook.com/business/help/1827488020602077"}
    - {title: "Change the schedule of an ad set", url: "https://en-gb.facebook.com/business/help/205560842812859"}
    - {title: "Facebook and Instagram Ads Pricing & Cost: An Overview", url: "https://www.facebook.com/business/ads/pricing"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.adset.location
  summary: "타겟 위치는 어느 지역 사람에게 광고를 보여 줄지 정하는 칸이에요. 택배로 보낼 수 있으면 전국으로 두는 게 새 손님을 찾기 쉬워요. 메타의 위치 옵션은 '이 지역에 사는 사람', '이 지역에 최근 있었던 사람', '이 지역에 사는 사람 또는 최근 있었던 사람(기본)', '이 지역을 여행 중인 사람'으로 나뉘어요. 내 지역 손님만 원하면 '사는 사람'을 고르면 더 정확해요."
  faq:
    - q: "내 동네에만 보이게 할 수 있어요?"
      a: "네, 지역을 정하고 '이 지역에 사는 사람' 옵션을 고르면 가장 좁게 잡혀요. 기본 옵션은 최근 그곳에 있었던 여행객도 포함해요."
    - q: "전국으로 하면 광고비가 흩어지나요?"
      a: "메타가 반응이 좋은 사람에게 보여 줘서 예산이 고르게 흩어지지는 않아요. 다만 택배가 안 되는 지역은 빼는 게 좋아요."
  keywords: [위치, 지역, 전국, 내 지역만, 동네, 택배 지역, 타겟 지역, 어디까지, 서울만, 반경]
  sources:
    - {title: "Use Location Targeting", url: "https://www.facebook.com/business/help/365561350785642"}
    - {title: "About location selection in Meta Ads Manager", url: "https://en-gb.facebook.com/business/help/202297959811696"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.adset.age_gender
  summary: "타겟 연령·성별은 주로 사는 손님이 누구인지 메타에 알려 주는 칸이에요. 어드밴티지+ 타겟에서는 이 범위가 '제안'이라서, 메타가 그 사람들을 우선 보여 주고 더 잘 될 것 같으면 범위 밖 사람에게도 보여 줘요. 반드시 지켜야 하는 한도는 최소 연령, 위치, 언어 같은 항목으로 따로 정해요. 메타 가격 안내는 타겟이 넓을수록 경매가 찾을 사람이 늘어난다고 설명해서, 소액이면 넓게 두는 걸 권해요."
  faq:
    - q: "연령을 20~30대로 좁히면 안 돼요?"
      a: "어드밴티지+ 타겟에서는 제안으로 들어가서 메타가 범위를 넓혀 보여 줄 수 있어요. 꼭 막고 싶은 건 최소 연령처럼 한도로 설정해요."
    - q: "성별도 정해야 해요?"
      a: "꼭 그럴 필요는 없어요. 넓게 두고 반응이 좋은 쪽을 한 달 결과로 확인하는 게 좋아요."
  keywords: [연령, 나이, 성별, 여성, 남성, 20대, 30대, 타겟 나이, 손님층, 어드밴티지 타겟, 타겟 좁히기]
  sources:
    - {title: "Meta Advantage+ Audience", url: "https://www.facebook.com/business/ads/meta-advantage-plus/audience"}
    - {title: "Facebook and Instagram Ads Pricing & Cost: An Overview", url: "https://www.facebook.com/business/ads/pricing"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.adset.transparency
  summary: "광고 투명성은 광고가 누구를 위해, 누가 돈을 내고 나가는지 밝히는 인증이에요. 메타 안내상 '수혜자'는 광고를 대신해서 내는 사람이나 단체, '결제자'는 돈을 낸 쪽이에요. 유럽연합, 싱가포르, 태국처럼 이 정보를 요구하는 나라가 있고, 인증을 안 하면 그 나라 대상 광고가 나가지 않아요. 국내 광고만 한다면 보통 필요 없고, 화면에 인증 안내가 뜰 때만 안내대로 하세요."
  faq:
    - q: "광고 투명성 인증이 뭐예요?"
      a: "광고가 누구를 위해 나가고 누가 비용을 냈는지 밝히는 절차예요. 일부 나라에서 법으로 요구해서 메타가 인증을 받아요."
    - q: "인증을 꼭 해야 하나요?"
      a: "화면에 인증 요청이 뜨면 해야 광고가 게시돼요. 안내가 안 뜨면 따로 하지 않아도 돼요."
  keywords: [광고 투명성, 인증, 게재 주체, 수혜자, 결제자, 광고주 인증, 광고주 확인, 본인 확인]
  sources:
    - {title: "Introduction to the Advertising Standards", url: "https://transparency.meta.com/policies/ad-standards/"}
    - {title: "New Verification Requirements for All Advertisers Targeting Singapore", url: "https://www.facebook.com/business/news/new-verification-requirements-for-all-advertisers-targeting-singapore"}
  check: "❓"
  checked: "2026-11-16"

- field_id: meta.adset.placements
  summary: "노출 위치는 광고가 어디에 보일지 정하는 칸이에요. '어드밴티지+ 노출 위치'는 메타가 페이스북, 인스타그램, 릴스, 스토리, Audience Network 등에서 성과가 좋은 곳을 자동으로 골라요. Audience Network는 다른 회사의 앱과 사이트에 광고가 나가는 곳이에요. 메타는 직접 고르는 '수동 노출 위치'로 바꾸거나 계정 설정에서 Audience Network를 뺄 수 있게 해요. 코치는 첫 달부터 Audience Network를 빼는 것을 기본으로 해요."
  faq:
    - q: "Audience Network가 뭐예요?"
      a: "페이스북·인스타그램이 아닌 다른 회사의 앱과 웹사이트에 광고가 나가는 지면이에요."
    - q: "노출 위치를 내가 고를 수 있어요?"
      a: "네, 수동 노출 위치를 고르면 원하는 곳만 켜고 끌 수 있어요. 다만 위치를 줄이면 메타가 찾을 수 있는 기회도 줄어요."
    - q: "인스타그램에만 나오게 할 수 있어요?"
      a: "수동 노출 위치에서 인스타그램 피드, 스토리, 릴스만 켜면 돼요."
  keywords: [노출 위치, 어디에 나와, 지면, 인스타 피드, 릴스, 스토리, audience network, 오디언스 네트워크, 다른 앱, 자동 노출]
  sources:
    - {title: "Meta Advantage+ Placements", url: "https://www.facebook.com/business/ads/meta-advantage-plus/placements"}
    - {title: "About Meta Ads Placements", url: "https://www.facebook.com/business/help/407108559393196"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.adset.brand_safety
  summary: "브랜드 적합성은 내 광고가 어떤 콘텐츠 옆에 나올지 거르는 정도를 정하는 칸이에요. 메타는 인벤토리 필터(확장·표준·제한 같은 단계)와 차단 목록으로 이를 조절하게 해요. 단계를 더 엄격하게 할수록 광고가 나올 수 있는 자리가 줄어요. 계정 전체에 정한 설정은 새 캠페인에 이어지고, 광고 세트에서는 더 엄격하게만 바꿀 수 있어요. 처음에는 기본값 그대로 두세요."
  faq:
    - q: "필터를 높이면 안전한가요?"
      a: "광고가 나올 수 있는 콘텐츠가 줄어서 안전해지는 대신 도달이 줄고 비용이 오를 수 있어요."
    - q: "특정 사이트에서 빼고 싶어요"
      a: "차단 목록을 만들면 특정 게시자나 사이트에서 광고가 나가지 않게 할 수 있어요."
  keywords: [브랜드 적합성, 브랜드 안전, 인벤토리 필터, 차단 목록, 콘텐츠 거르기, 불쾌한 콘텐츠, 안전한 곳에만]
  sources:
    - {title: "About Brand Safety on Facebook, Instagram, WhatsApp and Audience Network", url: "https://www.facebook.com/business/help/1559334364175848"}
    - {title: "About Inventory Filter in Ads Manager", url: "https://www.facebook.com/business/help/3001448133206080"}
  check: "✅"
  checked: "2026-11-16"

