- field_id: meta.ad.threads
  summary: "Threads 설정은 내 광고가 Threads(스레드) 앱에도 나가게 할지, 어떤 계정으로 보일지 정하는 칸이에요. 메타 광고 관리자에서 캠페인을 만들면 기본으로 Threads 피드 노출에 포함되고, 모바일에서만 나가요. Threads 계정이 없어도 인스타그램 계정으로, 그것도 없으면 페이스북 페이지로 광고를 낼 수 있어요. 그래서 따로 Threads 계정을 만들 필요는 없어요."
  faq:
    - q: "Threads 계정을 만들어야 해요?"
      a: "아니에요. 계정이 없으면 인스타그램 계정이 기본으로 쓰여요."
    - q: "Threads에 광고 안 나가게 하고 싶어요"
      a: "노출 위치를 수동으로 바꾸어 Threads를 끄면 돼요. 켜 두면 인스타그램 광고와 함께 나가요."
  keywords: [쓰레드, Threads, 스레드, 스레드 광고, 쓰레드 계정, 브랜딩]
