    - {title: "Use URL Tags for Tracking (Marketing API)", url: "https://developers.facebook.com/documentation/ads-commerce/instagram/ads-api/guides/url-tags-for-tracking"}
  check: "❓"
  checked: "2026-11-16"

- field_id: meta.ad.display_link
  summary: "표시 링크는 광고에 보이는 주소 글자예요. 실제로 눌렀을 때 이동하는 곳은 웹사이트 URL로 정해져요. 보통은 비워 두면 돼요. 메타 화면에 보이는 선택지를 따라 주세요."
  faq:
    - q: "표시 링크를 안 넣으면 어떻게 돼요?"
      a: "보통은 웹사이트 주소의 도메인이 그대로 보여요."
    - q: "표시 링크랑 웹사이트 URL이 달라도 돼요?"
      a: "표시되는 글자만 달라지고 눌렀을 때 가는 곳은 웹사이트 URL이에요."
  keywords: [표시 링크, 표시 주소, 보이는 주소, 브라우저 추가 기능, 링크 글자, 도메인 표시]
