  checked: "2026-11-16"

- field_id: meta.ad.third_party
  summary: "타사 보고는 구글 애널리틱스 같은 다른 도구의 숫자와 메타 광고 숫자를 함께 보는 것과 관련된 칸이에요. 두 도구는 숫자를 세는 방식이 달라서 같은 광고라도 클릭·방문 수가 맞지 않는 게 정상이에요. 메타 안내에 따르면 IP 주소로 위치를 판단하는 도구는 타겟 밖에서 온 클릭으로 보일 수 있고, 메타는 중복을 제거한 숫자를 써요. 실제 판매는 스토어 주문으로 확인하니 이 칸은 건너뛰어도 돼요."
  faq:
    - q: "메타 숫자랑 스토어 방문 숫자가 달라요"
      a: "정상이에요. 메타는 자기 기준의 기간·중복 제거로 세고, 다른 도구는 방식이 달라요. 같은 기간·같은 기준으로 비교하세요."
    - q: "구글 연결을 꼭 해야 해요?"
      a: "아니요. 실제 판매는 스토어 주문으로 확인하니 건너뛰어도 돼요."
  keywords: [타사 보고, 구글 연결, 구글 애널리틱스, 숫자가 달라요, 방문수 차이, 통계 차이, 외부 통계, GA]
  sources:
    - {title: "Troubleshoot metrics that don't add up", url: "https://en-gb.facebook.com/business/help/1098122253564910"}
    - {title: "Troubleshoot Third-party Ad Click Reporting", url: "https://www.facebook.com/business/help/1396683767238520"}
  check: "✅"
  checked: "2026-11-16"

# ── 광고 크리에이티브 ──
- field_id: meta.creative.copy
  summary: "기본 문구와 제목은 광고 사진 위·아래에 보이는 글이에요. 문구(기본 텍스트)는 최대 5개까지 넣을 수 있고, 여러 개를 넣으면 메타가 사람마다 반응이 좋을 것 같은 문구를 골라 보여 줘요. 알려 주신 장점으로 코치가 문구 3개를 써 드려요. 사실이 아닌 말(최저가, 1위 같은 근거 없는 표현)은 메타 광고 규정에도 어긋날 수 있어서 넣지 않아요."
  faq:
    - q: "문구는 몇 개 넣어요?"
      a: "최대 5개까지 가능해요. 코치가 3개를 써 드리니 마음에 드는 것을 고르면 돼요."
    - q: "문구를 직접 써도 돼요?"
      a: "네, 직접 쓰거나 코치 문구를 고쳐 쓸 수 있어요. 사실이 아닌 표현은 피하세요."
  keywords: [문구, 제목, 광고 문구, 카피, 기본 문구, 헤드라인, 장점, 뭐라고 써요, 문구 추천, 멘트]
  sources:
    - {title: "Asset Feed Options (Marketing API) - bodies/titles up to 5", url: "https://developers.facebook.com/docs/marketing-api/ad-creative/asset-feed-spec/options/"}
    - {title: "Introduction to the Advertising Standards", url: "https://transparency.meta.com/policies/ad-standards/"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.creative.cta
  summary: "행동 유도(CTA)는 광고 아래에 보이는 버튼 글자예요. '자세히 보기', '지금 구매하기', '가입하기' 같은 선택지가 있고, 어떤 버튼을 쓸 수 있는지는 캠페인 목표와 광고 종류에 따라 달라요. 상품 페이지로 보내는 광고라면 '자세히 보기'로 충분해요. 클릭은 많은데 스토어 방문이 적다면 버튼과 문구가 맞는지 점검해 보세요."
  faq:
    - q: "버튼을 '지금 구매하기'로 바꿔도 돼요?"
      a: "목표에 따라 쓸 수 있는 버튼이 정해져 있어요. 화면에 보이는 선택지 중에서 고르세요."
    - q: "버튼이 꼭 있어야 해요?"
      a: "버튼 없음도 고를 수 있는 광고가 있어요. 방문을 늘리는 광고라면 버튼이 있는 편이 눌러 보기 쉬워요."
  keywords: [행동 유도, CTA, 버튼, 자세히 보기, 지금 구매, 구매하기, 버튼 문구, 클릭 버튼]
  sources:
    - {title: "Ad Creative (Marketing API) call_to_action_type", url: "https://developers.facebook.com/docs/marketing-api/reference/adcreative"}
    - {title: "Asset Feed Options (Marketing API)", url: "https://developers.facebook.com/docs/marketing-api/ad-creative/asset-feed-spec/options/"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.creative.per_person_text
  summary: "사람마다 문구 최적화는 문구와 제목을 여러 개 넣었을 때 사람마다 반응이 좋을 문구를 보여 주는 기능이에요. 문구를 여러 개 넣으면 보는 사람에 따라 다른 문구가 보일 수 있다고 알려져 있어요. 미리보기에서는 가능한 모든 버전이 보이지 않을 수 있어요. 어느 문구가 효과였는지 비교하려면 끄고 A/B 테스트로 나눠서 보세요. 화면에서 켜져 있는지 한 번 확인해 보세요."
  faq:
    - q: "이걸 켜면 내가 쓴 문구가 바뀌어 보여요?"
      a: "문구를 여러 개 넣었을 때 사람마다 다른 문구가 보여요. 내가 쓴 문구 자체를 고쳐 쓰지는 않아요."
    - q: "어느 문구가 효과였는지 알려면요?"
      a: "이 기능을 끄고 A/B 테스트로 문구를 나눠 비교하는 게 정확해요."
  keywords: [사람마다 문구, 문구 최적화, 텍스트 최적화, 문구 섞기, 문구 여러 개, 사람별 문구, 다른 문구로 보여요]
  sources:
    - {title: "Asset Feed Options (Marketing API) - bodies/titles up to 5", url: "https://developers.facebook.com/docs/marketing-api/ad-creative/asset-feed-spec/options/"}
    - {title: "About Advantage+ creative", url: "https://en-gb.facebook.com/business/help/1720288338140238"}
  check: "❓"
  checked: "2026-11-16"

- field_id: meta.creative.ai_image
  summary: "이미지 생성(Meta AI)은 AI로 광고 이미지의 배경을 바꾸거나 변형 이미지를 만들어 주는 기능이에요. 원본 사진과 다르게 보일 수 있어서 상품 모습이 달라지지 않는지 꼭 확인해야 해요. 광고를 AI로 만들거나 크게 고치면 '이 광고 정보' 메뉴에 AI 정보 표시가 붙어요. 크기 조정이나 색 보정 같은 작은 수정에는 보통 붙지 않아요. 처음에는 쓰지 않고 원본으로 시작하세요."
  faq:
    - q: "AI 이미지를 쓰면 AI라고 표시돼요?"
      a: "AI 기능으로 만들거나 크게 편집한 광고는 AI 정보 라벨이 붙어요. 크기 조정 같은 작은 수정에는 보통 붙지 않아요."
    - q: "내 상품 사진이 이상하게 바뀌면요?"
      a: "생성된 이미지는 원본과 다르게 보일 수 있어요. 광고에 내기 전에 꼭 미리보기로 확인하고, 마음에 안 들면 끄세요."
  keywords: [이미지 생성, AI 이미지, 인공지능 사진, 배경 바꾸기, 메타 AI, AI로 만들기, 변형 이미지]
  sources:
    - {title: "Meta Advantage+ Creative", url: "https://www.facebook.com/business/ads/meta-advantage-plus/creative"}
    - {title: "How AI-generated images in ads are identified and labeled on Meta", url: "https://www.meta.com/help/artificial-intelligence/355108217670024/"}
  check: "✅"
  checked: "2026-11-16"

- field_id: meta.creative.advantage_enhancements
  summary: "어드밴티지+ 개선 사항은 메타가 광고의 문구, 사진, 영상, 레이아웃을 자동으로 조금씩 바꿔 사람마다 맞는 모습으로 보여 주는 기능 묶음이에요. 일부 항목은 광고를 만들 때 미리 켜져 있을 수 있고, 항목별로 게시 전이나 게시 후에 끌 수 있어요. 메타는 이 기능이 평균적으로 결과당 비용을 낮춘다고 밝혔지만, 광고 모습이 내 의도와 달라질 수 있어요. 상품 사진이 바뀌는 게 싫으면 항목을 확인하고 끄세요."
  faq:
    - q: "개선 사항이 자동으로 켜져 있어요. 꺼도 돼요?"
      a: "네, 항목별로 끌 수 있어요. 게시 전에도, 게시한 뒤에 광고 편집 화면에서도 가능해요."
    - q: "켜 두면 광고가 어떻게 바뀌나요?"
      a: "문구 변형, 밝기 조정, 레이아웃, 음악이나 애니메이션 같은 개선이 일부 자동으로 적용될 수 있어요. 켜진 항목을 확인해 보세요."
  keywords: [어드밴티지 개선, 개선 사항, 자동 개선, 밝기 조정, 음악, 애니메이션, 사진이 바뀌어요, 자동으로 켜져요, 크리에이티브 개선]
  sources:
    - {title: "About Creative Enhancements", url: "https://www.facebook.com/business/help/297506218282224"}
    - {title: "About Advantage+ creative", url: "https://en-gb.facebook.com/business/help/1720288338140238"}
    - {title: "Standard Enhancements for Advantage+ Creative (Marketing API)", url: "https://developers.facebook.com/docs/marketing-api/advantage-catalog-ads/standard-enhancements/"}
  check: "✅"
  checked: "2026-11-16"
