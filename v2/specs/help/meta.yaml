- field_id: meta.ad.creative_source
  summary: "크리에이티브 소스는 광고에 쓸 사진·영상을 어디서 가져올지 정하는 칸이에요. '수동 업로드'는 내가 직접 올린 사진을 쓰는 방식이고, 카탈로그에서 가져오는 방식은 카탈로그에 등록한 상품 이미지를 써요. 사진을 직접 올릴 거라면 수동 업로드를 그대로 두면 돼요. 메타 개발자 문서에도 이미지 출처를 수동 업로드와 카탈로그로 나눠서 설명해요."
  faq:
