- field_id: meta.ad.catalog
  summary: "제품 링크 추가(카탈로그)는 메타에 상품 목록(카탈로그)을 올려 두고 광고에 상품 카드를 붙이는 기능이에요. 어드밴티지+ 카탈로그 광고에서는 카탈로그의 상품명 같은 항목이 광고 문구에 자동으로 들어가요. 인스타그램 피드 등에서는 상품 태그가 붙어 상품 페이지로 이어져요. 상품이 많아진 뒤에 쓰는 기능이라 처음에는 쓰지 않아요."
  faq:
    - q: "카탈로그가 뭐예요?"
      a: "메타에 올려 두는 상품 목록이에요. 상품 이름, 사진, 가격, 링크가 들어가요. 상품이 한두 개인 첫 달에는 필요 없어요."
    - q: "카탈로그 없이도 광고 낼 수 있어요?"
      a: "네, 사진을 직접 올리고 웹사이트 주소를 넣어 광고를 낼 수 있어요."
