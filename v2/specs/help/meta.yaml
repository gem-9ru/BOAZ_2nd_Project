- field_id: meta.ad.media
  summary: "미디어는 광고에 쓸 사진이나 영상을 올리는 칸이에요. 메타는 올린 파일을 여러 노출 위치에 맞게 자동으로 잘라 줘요. 인스타그램 피드는 1:1, 페이스북 피드 이미지는 4:5, 스토리·릴스는 세로 9:16을 권해요. 더 정확하게 보이고 싶다면 비율별로 따로 올릴 수 있어요. 상품이 가운데 오도록 찍어야 잘려도 안전해요."
  faq:
    - q: "사진 크기는 어떻게 맞춰요?"
      a: "인스타그램 피드는 1080x1080(1:1), 스토리·릴스는 1080x1920(9:16)을 권해요. 상품이 가운데 오게 찍으면 잘려도 괜찮아요."
    - q: "사진이 잘려 보여요"
      a: "노출 위치마다 비율이 달라서 자동으로 잘려요. 비율별 사진을 따로 올리면 직접 조절할 수 있어요."
  keywords: [미디어, 사진, 영상, 사진 크기, 비율, 정사각형, 세로, 자르기, 잘려요, 해상도, 사진 올리기]
