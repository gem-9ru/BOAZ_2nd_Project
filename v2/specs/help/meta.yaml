  check: "✅"
  checked: "2026-11-16"

- field_id: meta.ad.offline_events
  summary: "오프라인 이벤트는 매장에서 일어난 판매를 메타로 올려서 광고와 연결해 보는 기능이에요. 이벤트 관리자에서 파일로 올리거나 판매 시스템(POS)·고객 관리 도구와 연동해서 보낼 수 있어요. 매장 구매는 '물리적 매장'에서 일어난 구매로 표시해서 보내요. 온라인(스토어)에서만 팔면 필요 없으니 건너뛰세요."
  faq:
    - q: "스토어만 하는데 필요해요?"
      a: "아니요. 매장에서 파는 경우에 쓰는 기능이라 온라인 판매만 하면 건너뛰면 돼요."
    - q: "오프라인 판매는 어떻게 올려요?"
      a: "이벤트 관리자의 오프라인 이벤트 세트에 파일을 올리거나 전용 연동으로 보내요. 구매 금액과 통화가 필요해요."
