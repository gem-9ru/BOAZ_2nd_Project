    - {title: "네이버 검색광고 공식 홈 (이 환경에서 열어 보지 못함)", url: "https://searchad.naver.com/"}
  check: "△"
  checked: "2026-11-16"

- field_id: naver.group.bid
  summary: "기본 입찰가는 손님이 광고를 한 번 눌렀을 때 내겠다는 최대 금액이에요. 키워드마다 따로 정하지 않으면 광고그룹의 이 값이 적용돼요. 파워링크의 최소 입찰가는 70원으로 안내돼요. 최대 금액은 자료에서 확인하지 못했으니 화면의 안내를 확인하세요. 네이버의 키워드 도구에서 평균 클릭 비용을 참고해 정해요."
  faq:
    - q: "입찰가가 높으면 무조건 돈이 그만큼 나가요?"
      a: "입찰가는 최대 금액이고 클릭될 때마다 빠져요. 입찰가를 올릴수록 상단에 나올 가능성은 커지지만 클릭당 비용도 오를 수 있어요."
    - q: "최소 입찰가가 얼마예요?"
      a: "파워링크는 70원으로 안내돼요. 쇼핑검색 등 다른 광고의 최소 금액은 자료에서 확인하지 못했어요. 바뀔 수 있으니 화면의 안내 금액을 확인하세요."
    - q: "키워드마다 다르게 정할 수 있어요?"
      a: "네, 키워드별로 따로 정하지 않은 키워드에만 광고그룹 기본 입찰가가 적용돼요."
  keywords: [입찰가, 기본 입찰가, 클릭당, 클릭 비용, 한 번 누르면, 얼마 내요, 입찰, 70원, 최소 금액, CPC]
  sources:
