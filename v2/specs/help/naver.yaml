- field_id: naver.keywords.list
  summary: "키워드는 손님이 네이버에서 검색할 때 내 광고를 띄울 검색어예요. 상호 같은 브랜드 키워드, 업종 이름 같은 일반 키워드, 더 구체적인 세부 키워드로 나눠요. 일치검색은 등록한 단어와 같거나 아주 비슷한 검색에만, 확장검색은 관련 있다고 판단되는 검색에도 나가요. 코치는 내 손님 찾기에서 고른 선물·시즌·상품 세부 검색어를 넣어요."
  faq:
    - q: "키워드는 몇 개나 넣어요?"
      a: "개수 기준은 자료에 없어요. 처음엔 사러 온 사람이 많은 세부 검색어 위주로 적게 시작하고, 결과를 보며 늘리는 방식이 소개돼요."
    - q: "일치검색이랑 확장검색 중에 뭘 써요?"
      a: "브랜드·세부 키워드는 일치검색, 일반 키워드는 확장검색으로 넣고 검색어 보고서를 확인하는 방식이 소개돼요. 확장검색은 엉뚱한 검색에도 나갈 수 있어 제외 키워드가 중요해요."
    - q: "쇼핑검색은 키워드를 넣나요?"
      a: "쇼핑검색은 키워드를 직접 등록하지 않고 상품 정보로 노출된다고 해설돼요. 이 칸은 파워링크 기준이에요."
  keywords: [키워드, 검색어, 단어, 일치검색, 확장검색, 세부 키워드, 브랜드 키워드, 몇 개, 어떤 단어, 등록]
