      a: "시간대를 지정하는 스케줄 설정이 있어요. 하지만 처음엔 어느 시간에 팔리는지 모르니 한 달 결과를 본 뒤 정하는 걸 권해요."
    - q: "광고가 안 나오는데 이 설정 때문일 수 있나요?"
      a: "네, 집행 시간을 지정했다면 그 시간 밖에서는 광고가 나오지 않아요. 노출이 안 될 때 가장 먼저 확인하라고 안내돼요."
