- field_id: naver.campaign.period
  summary: "기간은 캠페인의 광고 노출 기간을 정하는 칸이에요. 캠페인을 만들 때 고급옵션에서 정할 수 있고, 이미 만든 캠페인도 나중에 기간과 예산을 바꿀 수 있다고 소개돼요. 첫 달에는 30일로 종료일을 넣어 두면 끝나는 날을 잊어도 광고가 이어서 나가지 않아요."
  faq:
    - q: "종료일을 안 넣으면요?"
      a: "계속 노출되는 설정으로 안내돼요. 우리는 첫 달 결과를 보려고 종료일을 넣기로 했어요."
    - q: "기간을 나중에 늘릴 수 있어요?"
      a: "선택한 캠페인 관리에서 기간과 예산을 바꿀 수 있다고 소개돼요."
    - q: "광고가 안 나오는데 기간 때문일까요?"
      a: "노출 기간이나 광고 집행 시간 설정이 맞는지 먼저 확인하라고 안내돼요."
  keywords: [기간, 종료일, 끝나는 날, 시작일, 언제까지, 30일, 노출 기간, 며칠, 광고 기간]
  sources:
    - {title: "캠페인 운영/관리 및 전략 (대행사, 비공식)", url: "https://inside.ampm.co.kr/insight/1773"}
