- field_id: naver.group.age_gender_bid
  summary: "성별·연령 입찰 가중치는 특정 성별이나 나이대의 손님에게만 입찰가를 더 주거나 덜 주는 칸이에요. 이 칸의 세부 방식은 공식 자료를 확인하지 못했어요. 일반적으로 가중치는 데이터가 쌓인 뒤 실제 성과를 보고 조정하라고 권해져서, 첫 달은 쓰지 않아요."
