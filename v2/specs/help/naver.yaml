- field_id: naver.keywords.negative
  summary: "제외 키워드는 내 광고가 나가지 않게 막을 검색어예요. 사러 온 사람이 아닌 검색(예를 들면 만들기, 채용, 알바)에 돈이 나가는 걸 막아 줘요. 확장검색을 쓸 때 특히 중요해요. 광고를 켠 첫 주에 검색어 보고서를 보고 필요 없는 검색어를 계속 추가하는 방식이 소개돼요."
  faq:
    - q: "제외 키워드는 몇 개까지 넣어요?"
      a: "한 해설에서 쇼핑검색 기준으로 최대 70개라고 해요. 파워링크의 한도는 자료에서 확인하지 못했으니 화면의 안내를 보세요."
    - q: "어떤 단어를 제외해야 해요?"
      a: "사러 온 사람이 아닌 검색어예요. 만들기, 레시피, 지역 맛집 같은 단어를 코치가 추천해요. 실제 어떤 검색어로 광고가 눌렸는지는 검색어 보고서에서 확인해요."
    - q: "나중에 추가해도 돼요?"
      a: "네, 운영하면서 검색어 보고서를 보고 추가하는 방식이 권해져요."
  keywords: [제외 키워드, 제외키워드, 빼기, 나오지 않게, 막기, 만들기, 레시피, 맛집, 쓸데없는, 검색어 보고서, 낭비]
