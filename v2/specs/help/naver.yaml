      a: "가능하지만 손님이 바로 살 수 있도록 광고한 상품의 페이지 주소를 권해요."
    - q: "주소 뒤에 꼬리표를 붙여야 해요?"
      a: "코치는 붙이지 않아도 된다고 가정했지만, 공식 자료로 확인하지 못했어요. 스마트스토어 통계에서 유입이 보이는지 광고 시작 후 확인하세요."
    - q: "주소가 거절돼요"
      a: "등록한 비즈채널과 맞는 주소인지 확인하세요. 자세한 반려 사유는 광고주센터 안내를 보세요."
