- field_id: naver.group.schedule
  summary: "요일·시간은 광고를 보여 줄 요일과 시간대를 정하는 칸이에요. 정해 두면 그 시간 밖에서는 광고가 나가지 않아요. 어느 시간에 잘 팔리는지는 한 달 결과를 봐야 알 수 있어서 첫 달은 모든 요일·시간으로 둬요. 캠페인의 상세 데이터에서 요일·시간대별 성과를 볼 수 있다고 소개돼요."
  faq:
