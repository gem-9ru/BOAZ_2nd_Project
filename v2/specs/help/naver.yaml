- field_id: naver.ad.copy
  summary: "제목 (15자) · 설명 (45자)은 검색 결과에 보이는 광고 글이에요. 제목은 15자 이내, 설명은 띄어쓰기 포함 45자 이내라고 소개돼요. 설명의 최소 글자 수는 자료에 없어요. 입력 화면의 안내를 확인하세요. 혜택은 사실대로 쓰세요."
  faq:
    - q: "글자 수를 넘으면 어떻게 돼요?"
      a: "제목은 15자, 설명은 45자까지만 등록돼요. 코치가 만든 문구는 이 수에 맞춰 있어요."
    - q: "느낌표나 별표를 써도 돼요?"
      a: "특수문자 허용 범위는 열어 본 자료에 정확히 나와 있지 않아요. 입력 화면에서 등록이 안 되면 안내 문구를 확인하고, 꼭 필요한 부호만 쓰는 게 안전해요."
    - q: "'최고' '1위' 같은 말을 써도 돼요?"
      a: "이 표현을 막는지는 열어 본 자료에 나와 있지 않아요. 검수 기준은 화면 안내를 확인하시고, 근거 없는 최상급 표현은 쓰지 않는 게 안전해요."
    - q: "반응형 소재가 뭐예요?"
      a: "제목과 설명을 여러 개 넣으면 네이버가 조합을 바꿔 보여 주는 방식이에요. 개수는 자료마다 달라서 화면 안내를 보세요. 첫 달은 단일 소재를 권해요."
  keywords: [제목, 설명, 문구, 글자 수, 15자, 45자, 소재, 특수문자, 등록 불가, 반려, 최고, 1위, 광고 글, 반응형]
