  check: "△"
  checked: "2026-11-16"

- field_id: naver.campaign.daily_budget
  summary: "하루 예산은 캠페인이 하루에 쓸 수 있는 광고비의 최대 한도예요. 그날 예산을 다 쓰면 그날은 광고가 멈춰요. 한 달 예산을 이 칸에 넣으면 하루 만에 끝날 수 있으니 한 달 네이버 몫을 30일로 나눈 값을 넣으세요. 코치가 검색 수요를 보고 계산해 준 값이에요."
  faq:
    - q: "한 달 예산을 그대로 넣으면 안 돼요?"
      a: "안 돼요. 이 칸은 '하루' 한도라서 한 달 치를 넣으면 광고가 하루 만에 소진될 수 있다고 경고돼요."
    - q: "예산을 너무 적게 잡으면요?"
      a: "하루 중간에 광고가 멈출 수 있어요. 해설 글에서는 처음에 3~5만 원 정도로 시작해 반응을 보며 조정하라고 하지만, 우리 예산에서는 코치가 계산한 값이 기준이에요."
    - q: "제한 없음으로 둬도 돼요?"
      a: "제한 없음으로 두는 방법이 있다고 하지만, 예산이 빨리 나갈 수 있어서 초보 판매자는 하루 한도를 정해 두는 걸 권해요."
  keywords: [하루 예산, 일예산, 하루 얼마, 예산, 한도, 소진, 한 달 예산, 광고비 한도, 멈춰요]
