- field_id: naver.group.auto_bid
  summary: "자동입찰은 네이버의 알고리즘이 입찰가를 대신 조정해 주는 방식이에요. 전환이 잘될 것 같은 때는 올리고 효율이 낮은 때는 낮춘다고 설명돼요. 다만 학습하는 동안 성과가 들쭉날쭉하고 클릭당 비용이 오를 수 있어요. 첫 달에는 끄고 내가 정한 입찰가로 결과를 보는 걸 권해요."
  faq:
    - q: "자동입찰이 더 좋은 거 아닌가요?"
      a: "알아서 조정해 주는 장점이 있지만 학습 기간이 필요해요. 한 가이드는 최소 몇 주의 학습을 권해서, 한 달만 쓰는 초보 판매자에게는 맞지 않을 수 있어요."
    - q: "켜 두고 설정을 바꿔도 돼요?"
