- field_id: naver.group.device
  summary: "노출 매체는 광고를 PC와 모바일 중 어디에 보여 줄지 정하는 칸이에요. 기기마다 입찰가를 더 주거나 덜 주는 입찰 가중치가 있어서, 모바일에서 더 잘 팔리면 모바일 가중치를 올리라고 해설돼요. 처음에는 둘 다 켜 두고 결과가 나온 뒤 조정해요."
  faq:
    - q: "모바일에만 광고하고 싶어요"
      a: "기기별 입찰 가중치로 조절하는 방법이 소개돼요. 다만 첫 달은 둘 다 켜고 어디서 팔렸는지 본 다음 정하는 걸 권해요."
    - q: "블로그나 카페에도 광고가 나가나요?"
      a: "광고그룹의 노출 지면에서 검색 말고 '콘텐츠' 지면도 고를 수 있고, 처음에는 검색만 고르라는 해설이 있어요. 설정 화면에서 확인하세요."
    - q: "가중치는 몇 %로 넣어요?"
      a: "가중치는 기기별로 입찰가를 높이거나 낮추는 값이에요. 정확한 기본값과 넣을 수 있는 범위는 자료에 없어서, 설정 화면에서 확인해 주세요. 첫 달은 바꾸지 않고 둬요."
