# 네이버 검색광고 칸별 도움말 (2026-11-16 조사)
# 조사 한계: 이 작업 환경에서는 네이버 공식 도움말 사이트(searchad.naver.com, help.naver.com, saedu.naver.com,
# ads.naver.com)가 열리지 않아, 공식 페이지 본문을 직접 확인하지 못했다.
# 그래서 광고 대행사 해설·결제 안내 글(△)로 확인한 내용만 쓰고, 근거가 없으면 단정하지 않았다.
# 공식 출처는 "공식 홈(열어 보지 못함)"으로만 달아 두었다. 화면 이름·금액은 광고주센터에서 한 번 더 확인할 것.
# 원문은 옮기지 않고 요약했다.

- field_id: naver.pre.bizmoney
  summary: "비즈머니는 네이버 광고비를 미리 넣어 두는 선불 잔액이에요. 광고주센터의 비즈머니 메뉴에서 충전하기를 눌러 카드 등으로 금액을 직접 넣어요. 잔액이 있어야 새로 만든 광고의 검토가 진행된다고 안내돼요. 한 달 예산 중 네이버 몫만큼만 넣으면 돼요."
  faq:
    - q: "비즈머니가 0원이면 어떻게 돼요?"
      a: "광고 검토가 진행되지 않고, 잔액이 떨어지면 광고가 내려간다고 안내돼요. 먼저 필요한 만큼 충전해 두세요."
    - q: "자동충전도 있어요?"
      a: "비즈머니 메뉴 안의 자동충전 관리에서 설정할 수 있고, 한 안내 글에서는 1만 원부터 정할 수 있다고 해요. 처음에는 직접 충전해서 쓰는 만큼 보는 걸 권해요."
    - q: "카드로 충전하면 세금 처리는 어떻게 해요?"
      a: "한 결제 안내 글에서는 신용카드 충전은 100원 단위로 되고, 이 카드 전표로는 부가세 신고를 할 수 없다고 해요. 세금계산서가 필요하면 광고주센터나 고객센터에 먼저 물어보세요."
    - q: "충전한 돈을 돌려받을 수 있어요?"
      a: "광고주센터 비즈머니 관리 메뉴에서 환불을 신청하는 방법이 소개돼요. 다만 오래된 글이라 최신 조건은 광고주센터에서 확인해 주세요."
  keywords: [비즈머니, 충전, 광고비, 잔액, 0원, 자동충전, 결제, 카드, 환불, 돈 넣기, 선불]
  sources:
    - {title: "광고비 및 SaaS 인보이스 카드 결제 방법 (결제 안내, 비공식)", url: "https://docs.channel.io/gowid-guide/ko/articles/%EA%B4%91%EA%B3%A0%EB%B9%84-%EB%B0%8F-SaaS-%EC%9D%B8%EB%B3%B4%EC%9D%B4%EC%8A%A4-%EC%B9%B4%EB%93%9C-%EA%B2%B0%EC%A0%9C-%EB%B0%A9%EB%B2%95-%ED%95%9C%EB%88%88%EC%97%90-%EB%B3%B4%EA%B8%B0-dfa4c428"}
    - {title: "네이버 광고 예산 - 비즈머니 충전 방법 (대행사 강의, 비공식)", url: "https://inside.ampm.co.kr/video/4217"}
    - {title: "네이버 검색광고 공식 홈 (이 환경에서 열어 보지 못함)", url: "https://searchad.naver.com/"}
  check: "△"
