- field_id: naver.pre.bizchannel
  summary: "비즈채널은 광고가 연결될 내 사이트를 네이버 검색광고에 등록하고 인증받는 절차예요. 등록한 채널로만 광고를 낼 수 있어요. 스마트스토어는 '쇼핑몰' 채널로 등록하는 방법과 '웹사이트' 채널로 주소를 넣는 방법이 소개돼요. 쇼핑몰 채널은 쇼핑파트너센터에 입점해 있고 그 센터 ID가 있어야 등록돼요."
  faq:
    - q: "비즈채널은 어디서 등록해요?"
      a: "로그인한 뒤 정보관리의 비즈채널 관리에서 채널 추가를 누르고 유형(웹사이트·쇼핑몰)을 골라요. 입력한 정보가 맞으면 네이버가 확인해서 등록이 끝나요."
    - q: "쇼핑파트너센터 ID를 몰라요"
      a: "쇼핑몰 채널은 쇼핑파트너센터 ID가 꼭 필요해요. 모르면 쇼핑파트너센터의 ID 찾기에서 조회할 수 있다고 안내돼요. 입점이 안 돼 있으면 등록이 안 돼요."
    - q: "검토는 얼마나 걸려요?"
      a: "채널 인증 시간은 자료에 없어요. 광고 소재 검토 시간도 자료에 없어요. 검토는 비즈머니 잔액이 있어야 진행된다고 소개돼요. 광고 시작 전에 미리 등록해 두세요."
  keywords: [비즈채널, 쇼핑몰 등록, 스마트스토어 등록, 채널 추가, 쇼핑파트너센터, 입점, 노출 가능, 검토, 사이트 등록, 인증]
  sources:
    - {title: "네이버 검색광고 '비즈채널 등록' 쉽게 설명 (대행사, 비공식)", url: "https://inside.ampm.co.kr/insight/12520"}
    - {title: "네이버 검색광고 등록 프로세스 (대행사, 비공식)", url: "https://inside.ampm.co.kr/insight/1613"}
    - {title: "네이버 검색광고 공식 홈 (이 환경에서 열어 보지 못함)", url: "https://searchad.naver.com/"}
  check: "△"
  checked: "2026-11-16"

- field_id: naver.campaign.type
  summary: "캠페인 유형은 검색 결과에 어떤 모양으로 광고를 보여 줄지 고르는 칸이에요. 파워링크는 가게 이름·설명 문구가 나가고 내가 고른 키워드로 입찰해요. 쇼핑검색은 상품 이미지와 가격 같은 상품 정보가 나가고 상품 단위로 입찰해요. 둘 다 클릭될 때만 돈이 나가요(클릭당 과금)."
  faq:
    - q: "파워링크랑 쇼핑검색 중에 뭐가 나아요?"
      a: "목적에 따라 달라요. 내 가게나 브랜드를 알리고 방문을 늘리려면 파워링크, 상품 판매를 늘리려면 쇼핑검색이 맞다고 해설돼요. 처음에는 하나만 켜고 결과를 보세요."
    - q: "둘 다 켜도 돼요?"
      a: "같은 검색어에 둘 다 켤 수 있고, 파워링크는 정보를 찾는 손님, 쇼핑검색은 구매로 이어지는 손님을 맡도록 역할을 나눌 수 있다고 해설돼요. 다만 처음 하시는 거라면 하나로 시작해 결과를 본 뒤 늘리는 걸 권해요."
    - q: "쇼핑검색은 키워드를 직접 넣나요?"
      a: "쇼핑검색은 키워드를 직접 등록하지 않고, 상품 이름과 정보가 검색어와 맞춰져 노출된다고 해설돼요."
  keywords: [캠페인 유형, 파워링크, 쇼핑검색, 쇼핑검색광고, 사진, 가격, 상품 광고, 문구 광고, 어떤 광고, 차이, 종류]
  sources:
    - {title: "파워링크 vs 쇼핑검색 뭐가 더 좋을까? (대행사, 비공식)", url: "https://inside.ampm.co.kr/insight/7243"}
    - {title: "네이버 쇼핑검색광고(SA)의 A to Z (대행사, 비공식)", url: "https://inside.ampm.co.kr/insight/60186"}
    - {title: "네이버 검색광고 공식 홈 (이 환경에서 열어 보지 못함)", url: "https://searchad.naver.com/"}
  check: "△"
  checked: "2026-11-16"

- field_id: naver.campaign.name
  summary: "캠페인 이름은 내가 알아보려고 붙이는 이름이라 광고에 보이지 않아요. 캠페인을 만들 때 이름을 입력하고, 기간·하루예산 같은 고급옵션을 이어서 정해요. 코치가 만들어 준 이름을 그대로 써도 되고, 나중에 헷갈리지 않는 이름이면 바꿔도 돼요."
  faq:
    - q: "캠페인 이름이 광고에 보이나요?"
      a: "관리 화면에서 구분하려는 이름으로 소개돼요. 손님에게 보이는 글은 소재의 제목과 설명이에요."
    - q: "이름은 나중에 바꿔도 돼요?"
      a: "이 칸의 수정 방법은 자료에 없어요. 광고주센터에서 캠페인을 선택해 확인해 주세요."
  keywords: [캠페인 이름, 이름, 이름 짓기, 캠페인명, 구분, 이름 규칙]
  sources:
    - {title: "캠페인 운영/관리 및 전략 (대행사, 비공식)", url: "https://inside.ampm.co.kr/insight/1773"}
