# 메타 광고 관리자 칸 사양 (트래픽 목표 기준)
# 원본: 희수 '메타 트래픽 광고 분석 — 챗봇 질문 설계 & 리포트 컬럼 분석' 3-1~3-4 (11/12)
#
# kind
#   question   사장님 상황에 따라 답이 달라짐 → 챗봇이 쉬운 말로 물음
#   precheck   광고 만들기 전 준비 확인 (질문으로 물음)
# stage '사전 점검' 칸은 ① 찾기 앞 '시작 전 준비물' 화면에서 묻는다 (② 세팅에서 다시 묻지 않음).
# required: true → 이 칸이 첫 답(있어요 등)이 아니면 [광고 관리자 열기]를 막는다 (없으면 광고를 낼 수 없음)
#   llm        사장님 답을 바탕으로 챗봇이 써서 고르게 함 (키 없으면 문장 틀)
#   auto       규칙대로 앱이 만들어 넣음 (이름, 추적 링크, 일 예산)
#   default    초보에게 정답이 거의 정해짐 → 묻지 않고 기본값 + 한 줄 설명
#   next_cycle 결과를 봐야 바꿀 근거가 생김 → 첫 달은 기본값, 한 달 뒤 규칙이 바꿈
# next_cycle: 이 칸을 바꿀 수 있는 규칙 id (rules.yaml)
# 순서는 광고 관리자 화면 순서

media: meta
title: 메타 (인스타그램·페이스북) 광고
fields:
  # ── 사전 점검 (시작 전 준비물) ──
  - id: meta.pre.fb_login
    stage: 사전 점검
    label: 페이스북 개인 계정
    kind: precheck
    required: true
    ask: 컴퓨터 크롬에서 페이스북에 로그인할 수 있으세요? 메타 광고는 개인 페이스북 계정으로 만들어요.
    options: [로그인할 수 있어요, 계정이 없어요]
    default: 로그인할 수 있어요
    why: 광고 관리자는 페이스북 계정으로 들어가요. 로그인은 사장님이 직접 해요 (비밀번호는 어디에도 넣지 않아요).
    help:
      계정이 없어요:
        say: 아래 링크에서 페이스북 계정을 만든 뒤, 이 컴퓨터 크롬에서 로그인해 주세요. 다 하면 '만들었어요'를 눌러 주세요.
        link: 페이스북 가입하기
        url: https://www.facebook.com/r.php
        done: 만들었어요
        done_value: 로그인할 수 있어요
        later: 나중에 만들게요

  - id: meta.pre.fb_page
    stage: 사전 점검
    label: 대표 계정 – Facebook 페이지
    kind: precheck
    required: true
    ask: 페이스북 페이지가 있으세요? 인스타그램만 쓰셔도 광고를 내려면 꼭 있어야 해요.
    options: [있어요, 없어요]
    default: 있어요
    why: 페이지가 없으면 광고를 만들 수 없어요. 없다면 '페이지 만들기'부터 하세요 (무료, 5분).
    help:                     # 이 답을 고르면 바로 넘어가지 않고 할 일을 보여 줌 (링크는 새 탭)
      없어요:
        say: 광고를 내려면 페이스북 페이지가 꼭 있어야 해요. 아래 링크에서 가게 이름으로 만들어 주세요 (무료, 5분). 만든 뒤 '만들었어요'를 눌러 주세요.
        link: 페이스북 페이지 만들기
        url: https://www.facebook.com/pages/create
        done: 만들었어요
        done_value: 있어요
        later: 나중에 만들게요

  - id: meta.pre.payment
    stage: 사전 점검
    label: 광고 계정 결제 수단
    kind: precheck
    required: true
    ask: 광고 계정에 결제 카드를 등록해 두셨어요?
    options: [등록했어요, 아직이에요]
    default: 등록했어요
    why: 카드가 없으면 마지막 '게시'에서 막혀요. 광고비는 ② 세팅에서 정한 총예산까지만 나가게 맞춰요. 카드에는 부가세 10%가 더 붙을 수 있어요 (3만 원 → 33,000원). 사업자등록번호를 결제 설정 → 비즈니스 정보 [수정] → '납세자 번호' 칸에 넣으면 보통 안 붙어요. 없으면 비워 둬도 광고는 낼 수 있어요.
    help:
      아직이에요:
        say: 아래 링크의 결제 설정에서 카드를 등록해 주세요. 카드 정보는 사장님이 직접 넣어요. 광고비는 정한 총예산까지만 나가고, 부가세 10%가 더 붙을 수 있어요. 사업자등록번호가 있으면 같은 화면의 비즈니스 정보 [수정] → '납세자 번호' 칸에 넣어 주세요 (넣으면 보통 안 붙어요). 다 하면 '등록했어요'를 눌러 주세요.
        link: 결제 설정 열기
        url: https://business.facebook.com/billing_hub/payment_settings
        done: 등록했어요
        done_value: 등록했어요
        later: 나중에 할게요

  - id: meta.pre.media
    stage: 사전 점검
    label: 광고 사진·영상
    kind: precheck
    ask: 광고에 쓸 사진이나 영상이 있으세요?
    options: [있어요, 아직이에요]
    default: 있어요
    why: 광고 만들 때 사진(또는 영상)을 1~3개 올려요. 휴대폰 사진도 상품이 크게 보이면 충분해요.
    help:
      아직이에요:
        say: 이렇게 준비해 주세요. 다 하면 '준비했어요'를 눌러 주세요.
        steps:
          - text: 상품이 화면 가운데에 크게 보이는 사진 1~3장 (밝은 곳에서)
          - text: 정사각형(1:1)이나 세로(4:5), 가로세로 1080픽셀 이상
          - text: 사진 위 글자는 짧게 (가게 이름·할인 한 줄 정도)
        done: 준비했어요
        done_value: 있어요
        later: 나중에 할게요

  - id: meta.pre.ig_account
    stage: 사전 점검
    label: 대표 계정 – Instagram 프로필
    kind: question
    ask: 광고에 보일 인스타그램 계정 이름을 알려 주세요.
    input: text
    default: ""
    why: 개인 계정과 가게 계정이 여러 개면 가게 계정을 알려 주세요. 인스타그램이 없으면 비워 두고 [다음]을 눌러 주세요.

  - id: meta.pre.store_product
    stage: 사전 점검
    label: 스마트스토어 상품 페이지
    kind: precheck
    ask: 이 상품을 스마트스토어에 올리셨어요?
    options: [올렸어요, 아직이에요, 스마트스토어에서 안 팔아요]
    default: 올렸어요
    why: 광고를 누른 손님이 바로 살 수 있게 상품 페이지 주소가 있어야 해요.
    help:
      아직이에요:
        say: 스토어를 열고 상품을 올려 주세요. 다 하면 '다 했어요'를 눌러 주세요.
        steps:                # 할 일 체크리스트 (링크는 새 탭). hint: keywords → ① 찾기의 검색어 한 줄
          - text: 판매자 가입 (스토어 이름도 이때 정해요)
            link: 가입하기
            url: https://sell.smartstore.naver.com/#/join
          - text: 상품 등록
            link: 상품 등록하기
            url: https://sell.smartstore.naver.com/#/products/create
            hint: keywords
          - text: 올린 상품 페이지를 열어 주소 복사하기
        done: 다 했어요
        done_value: 올렸어요
        later: 나중에 할게요
    then_ask:                 # 답에 따라 같은 자리에서 주소를 받음 (광고 관리자 칸이 아니라 '클릭 주소'에서 미리 채움)
      field:
        올렸어요: meta.pre.store_url
        아직이에요: meta.pre.insta_url
        스마트스토어에서 안 팔아요: meta.pre.insta_url
      say:
        올렸어요: 올린 상품 페이지 주소를 붙여 넣어 주세요.
        아직이에요: 그동안은 인스타그램 프로필로 보낼게요. 주소가 맞는지 확인해 주세요.
        스마트스토어에서 안 팔아요: 광고를 누르면 인스타그램 프로필로 보낼게요. 프로필 주소가 맞는지 확인해 주세요.
      prefill:
        아직이에요: https://www.instagram.com/{meta.pre.ig_account}
        스마트스토어에서 안 팔아요: https://www.instagram.com/{meta.pre.ig_account}
      none:                   # 주소 칸 아래 '상품 페이지 주소가 없어요' → 이 답으로 바꿔 인스타 프로필 주소를 받음
        올렸어요: 스마트스토어에서 안 팔아요

  # ── 캠페인 ──

  - id: meta.pre.language
    stage: 사전 점검
    label: 광고 관리자 화면 언어
    kind: precheck
    ask: 페이스북 화면이 한국어로 보이세요?
    options: [한국어예요, 다른 말이에요]
    default: 한국어예요
    why: 광고 관리자도 페이스북과 같은 말로 나와요. 뭉치는 한국어 화면에서만 칸을 찾아요.
    help:
      다른 말이에요:
        say: 아래 링크에서 언어를 '한국어'로 바꿔 주세요. 다 하면 '바꿨어요'를 눌러 주세요.
        link: 언어 설정 열기
        url: https://www.facebook.com/settings?tab=language
        done: 바꿨어요
        done_value: 한국어예요
        later: 나중에 할게요
  - id: meta.campaign.name
    stage: 캠페인
    label: 캠페인 이름
    kind: auto
    auto: campaign_name
    why: 나중에 헷갈리지 않게 '상품_목표_월' 규칙으로 만들어요.

  - id: meta.campaign.buying_type
    stage: 캠페인
    label: 구매 유형
    kind: default
    default: 경매
    why: 다른 광고와 경쟁해서 노출되는 방식이에요. 트래픽 목표에서는 경매만 보여요.

  - id: meta.campaign.objective
    stage: 캠페인
    label: 캠페인 목표
    kind: question
    ask: 광고로 가장 원하는 게 뭐예요?
    options: [스토어 방문 늘리기, 가게 알리기]
    map: {스토어 방문 늘리기: 트래픽, 가게 알리기: 인지도}
    default: 스토어 방문 늘리기
    why: 판매 목표는 구매 데이터가 있어야 잘 돌아가요. 첫 달은 방문을 늘리고, 판매는 스토어 주문으로 직접 확인해요.

  - id: meta.campaign.special_category
    stage: 캠페인
    label: 특별 광고 카테고리
    kind: question
    ask: 금융·고용·주택·사회문제·선거·정치 관련 상품인가요?
    options: [아니요, 네]
    default: 아니요
    why: 신용·고용·주택 광고는 타겟 설정이 제한되고, 사회 문제·선거·정치 광고는 광고주 인증이 필요해요. 디저트·생활용품은 대부분 '아니요'예요.

  - id: meta.campaign.budget_strategy
    stage: 캠페인
    label: 예산 전략 (캠페인 예산 / 광고 세트 예산)
    kind: next_cycle
    default: 광고 세트 예산
    why: 캠페인 예산으로 두면 하루 예산처럼 계속 나갈 수 있어서, 광고 세트 예산(총예산)으로 둬요. 뭉치가 이 칸을 안내해요.

  - id: meta.campaign.budget_share
    stage: 캠페인
    label: 예산 최대 20% 공유
    kind: default
    default: 끄기
    why: 켜 두면 한 광고 세트가 자기 예산보다 더 쓸 수 있어서 꺼요. 뭉치가 '예산 전략' 칸에서 같이 안내해요.

  - id: meta.campaign.bid_strategy
    stage: 캠페인
    label: 입찰 전략
    kind: next_cycle
    default: 최고 볼륨
    next_cycle: [rule.cost_rising]
    why: 예산 안에서 클릭을 최대한 많이 받는 방식이에요. 적정 비용 기준이 없는 첫 달은 이게 맞아요.

  - id: meta.campaign.ab_test
    stage: 캠페인
    label: A/B 테스트
    kind: next_cycle
    default: 끄기
    next_cycle: [rule.creative_weak, rule.creative_fatigue]
    why: 비교 기준이 생기는 한 달 뒤, 소재를 비교할 때 켜요.

  # ── 광고 세트 ──
  - id: meta.adset.name
    stage: 광고 세트
    label: 광고 세트 이름
    kind: auto
    auto: adset_name
    why: 나중에 헷갈리지 않게 규칙으로 만들어요.

  - id: meta.adset.conversion_location
    stage: 광고 세트
    label: 전환 위치
    kind: question
    ask: 손님이 광고를 누르면 어디로 가면 좋겠어요?
    options: [스토어 상품 페이지, 인스타그램 프로필]
    default: 스토어 상품 페이지
    why: 스토어로 보내야 한 달 뒤 스토어 주문으로 결과를 확인할 수 있어요.
    then_ask:                 # 고른 뒤 같은 자리에서 그 주소까지 받음 → '웹사이트 URL'은 따로 다시 묻지 않음
      field: meta.ad.website_url
      say:
        스토어 상품 페이지: 광고를 누르면 열릴 상품 페이지 주소를 붙여 넣어 주세요.
        인스타그램 프로필: 광고를 누르면 열릴 인스타그램 프로필 주소예요. 맞는지 확인해 주세요.
      prefill:                # {칸 id} 자리에 앞에서 받은 답을 넣음. 목록이면 채워지는 첫 값
        스토어 상품 페이지: "{meta.pre.store_url}"
        인스타그램 프로필: ["{meta.pre.insta_url}", "https://www.instagram.com/{meta.pre.ig_account}"]
      none:
        스토어 상품 페이지: 인스타그램 프로필
    default_if:               # 앞 답에 따라 권장 답을 바꿈
      meta.pre.store_product: {아직이에요: 인스타그램 프로필, 스마트스토어에서 안 팔아요: 인스타그램 프로필}
    note_if:
      meta.pre.store_product:
        아직이에요: 스토어가 준비되면 스토어 상품 페이지로 바꿀 수 있어요.
        스마트스토어에서 안 팔아요: 스마트스토어 상품이 없으니 인스타그램 프로필로 보내요. 프로필에 상품 사진과 문의 방법을 올려 두세요.

  - id: meta.adset.performance_goal
    stage: 광고 세트
    label: 성과 목표
    kind: default
    default: 링크 클릭수 극대화
    why: "'랜딩 페이지 조회수 극대화'는 메타 픽셀이 있어야 제대로 세는데, 스마트스토어에는 픽셀을 달 수 없어요. 그래서 링크 클릭을 늘리고, 실제 방문은 스토어 통계(NT 꼬리표)로 확인해요."

  - id: meta.adset.attribution_model
    stage: 광고 세트
    label: 기여 모델
    kind: default
    default: 일반
    why: 트래픽 목표에서는 '증대'를 고를 수 없어요. 판매는 스토어 주문으로 따로 확인해요.

  - id: meta.adset.cost_goal
    stage: 광고 세트
    label: 결과당 비용 목표
    kind: next_cycle
    default: 비워 둠
    next_cycle: [rule.cost_rising]
    why: 첫 달 평균을 알아야 목표를 정할 수 있어요.

  - id: meta.adset.value_rules
    stage: 광고 세트
    label: 가치 조정 (규칙 세트)
    kind: next_cycle
    default: 비워 둠
    next_cycle: [rule.segment_winner]
    why: 특정 연령·노출 위치의 우선순위를 높이는 기능이에요. 잘되는 그룹이 확인되면 써요.

  - id: meta.adset.delivery_type
    stage: 광고 세트
    label: 게재 유형
    kind: default
    default: 일반 게재
    why: 예산을 하루 동안 고르게 나눠 써요. 가속 게재는 예산이 빨리 사라져서 초보에게 맞지 않아요.

  - id: meta.adset.dynamic_creative
    stage: 광고 세트
    label: 다이내믹 크리에이티브
    kind: next_cycle
    default: 끄기
    next_cycle: [rule.creative_weak]
    why: 조합할 사진·문구가 여러 개 생기면 켜요.

  - id: meta.adset.live
    stage: 광고 세트
    label: 라이브 방송 광고
    kind: default
    default: 끄기
    why: 인스타그램 라이브를 할 때만 쓰는 설정이에요.

  - id: meta.adset.daily_budget
    stage: 광고 세트
    label: 일일 예산
    kind: auto
    auto: meta_daily_budget
    why: 코치가 나눈 메타 몫을 광고 기간으로 나눈 값이에요. 메타는 하루 최대 1.75배까지 쓸 수 있으니 주 단위로 확인하세요.

  - id: meta.adset.end_date
    stage: 광고 세트
    label: 종료 날짜
    kind: question
    ask: 광고를 언제부터 언제까지 할까요?
    options: [7일, 14일, 30일]   # 오늘부터
    custom: dates             # [날짜 직접 정하기] → 시작일·종료일 (답: 2026-12-01~2026-12-14). 시작일은 광고 관리자 '시작 날짜'에 넣음
    default: 14일
    next_cycle: [rule.awareness_freq_low]
    why: 종료 날짜는 기본으로 비어 있어서, 끄지 않으면 계속 돈이 나가요. 소액이면 짧고 굵게(7~14일)가 사람들에게 더 기억돼요.

  - id: meta.adset.lifetime_budget
    stage: 광고 세트
    label: 총예산 (기간 전체)
    kind: question
    ask: 광고 기간 전체에 총 얼마 쓸까요?
    options: [1만 원, 3만 원, 5만 원]
    custom: won               # [금액 직접 넣기] → 원 단위 (답: 25,000원)
    default: 3만 원
    why: 하루 예산이 아니라 기간 전체에 쓸 돈이에요. 광고비는 이 금액을 넘지 않아요 (부가세 별도). 메타는 하루에 약 1,336원보다 적게 받으면 광고를 거의 안 내보내요.

  - id: meta.adset.location
    stage: 광고 세트
    label: 타겟 – 위치
    kind: question
    ask: 손님이 상품을 어떻게 받나요?
    options: [택배로 보내요, 가게에 와서 사요, 배달해요]
    default: null             # 권장 없음: 판매 방식은 가게마다 정해져 있음 (동네 가게가 전국으로 나가지 않게)
    answer_as: {택배로 보내요: 전국 (택배)}      # 고른 답 대신 이 값을 세팅에 넣음 (광고 관리자 기본 '대한민국' 그대로)
    custom: area              # 아래 답이면 같은 자리에서 가게 주소(시·구·동)와 반경(3·5·10km, 기본 5km)을 받음
    custom_for: [가게에 와서 사요, 배달해요]   # 값 예: '가게 주변 5km · 서울 마포구 망원동' (지도는 사장님이 직접)
    next_cycle: [rule.target_saturation]
    why: 택배면 전국, 가게·배달이면 가게 주변만 보여야 광고비가 헛되이 나가지 않아요.

  - id: meta.adset.age_gender
    stage: 광고 세트
    label: 타겟 – 연령·성별
    kind: question
    ask: 주로 사는 손님이 누구인가요? (메타가 이 범위를 출발점으로 더 넓게 찾아요)
    input: text
    default: 넓게 (어드밴티지+ 타겟 추천)
    suggest_from: market_age_gender
    next_cycle: [rule.target_saturation, rule.segment_winner]
    why: 소액에서 타겟을 좁히면 같은 사람에게만 계속 보여요. 나이는 문구·사진 방향으로 쓰고 타겟은 넓게 두세요.

  - id: meta.adset.transparency
    stage: 광고 세트
    label: 광고 투명성 (게재 주체 인증)
    kind: default
    default: 인증하기
    why: 게시 전에 인증이 필요해요. 무료이고 몇 분 걸려요.

  - id: meta.adset.placements
    stage: 광고 세트
    label: 노출 위치
    kind: next_cycle
    default: 어드밴티지+ 노출 위치, Audience Network 제외
    next_cycle: [rule.placement_quality, rule.ig_share_low]
    why: 다른 앱 광고 자리(Audience Network)는 클릭은 싸지만 구매로 잘 안 이어져서 처음부터 빼요.

  - id: meta.adset.brand_safety
    stage: 광고 세트
    label: 브랜드 적합성
    kind: default
    default: 그대로 둠
    why: 불쾌한 콘텐츠 차단은 모든 광고에 기본 적용돼요. 필터를 더 켜면 도달이 줄고 비용이 올라요.

  # ── 광고 ──
  - id: meta.ad.name
    stage: 광고
    label: 광고 이름
    kind: auto
    auto: ad_name
    why: 어떤 사진의 결과인지 구분하려고 규칙으로 만들어요.

  - id: meta.ad.partnership
    stage: 광고
    label: 파트너십 광고
    kind: default
    default: 끄기
    why: 다른 크리에이터와 함께 내는 광고예요. 처음엔 필요 없어요.

  - id: meta.ad.threads
    stage: 광고
    label: Threads 프로필 / 브랜딩
    kind: default
    default: 그대로 둠
    why: 인스타그램 계정을 그대로 써요. 따로 만들 필요 없어요.

  - id: meta.ad.catalog
    stage: 광고
    label: 제품 링크 추가 (카탈로그)
    kind: next_cycle
    default: 쓰지 않음
    why: 상품이 많아지면 써요.

  - id: meta.ad.creative_source
    stage: 광고
    label: 크리에이티브 소스
    kind: default
    default: 수동 업로드
    why: 사진을 직접 올린다는 뜻이에요. 회색 '제품 미디어'는 카탈로그가 있을 때만 써요.

  - id: meta.ad.format
    stage: 광고
    label: 형식
    kind: question
    ask: 보여 줄 사진이 1장이에요, 여러 장이에요?
    options: [1장 (단일 이미지), 여러 장 (슬라이드)]
    default: 1장 (단일 이미지)
    why: 사진이 여러 장이면 슬라이드로 상품을 여러 각도에서 보여 줄 수 있어요.

  - id: meta.ad.multi_advertiser
    stage: 광고
    label: 여러 광고주의 광고
    kind: default
    default: 끄기
    why: 켜면 다른 광고와 함께 보이고 사진이 잘릴 수 있어요.

  - id: meta.ad.website_url
    stage: 광고
    label: 웹사이트 URL
    kind: question
    ask: 광고를 누르면 보여 줄 상품 페이지 주소를 알려 주세요.
    input: url
    default: ""
    why: 이 주소 뒤에 추적 꼬리표를 붙여서, 한 달 뒤 '메타로 온 손님'을 스토어 통계에서 구분해요.

  - id: meta.ad.tracking_url
    stage: 광고
    label: 추적 – URL 매개변수
    kind: auto
    auto: meta_tracking
    why: 스마트스토어는 NT 꼬리표, 자사몰은 UTM으로 만들어요. 값이 매번 달라지면 통계가 섞여서 코치가 규칙을 고정해요.

  - id: meta.ad.display_link
    stage: 광고
    label: 표시 링크 / 브라우저 추가 기능
    kind: default
    default: 비워 둠
    why: 표시 링크는 광고에 보이는 주소일 뿐이고, 실제 이동은 웹사이트 URL로 돼요.

  - id: meta.ad.media
    stage: 광고
    label: 미디어 · 자르기
    kind: question
    ask: 광고에 쓸 사진이나 영상을 준비해 주세요. 정사각형(1:1)이나 세로(9:16)가 좋아요.
    options: [정사각형 사진, 세로 사진·영상, 둘 다]
    default: 정사각형 사진
    next_cycle: [rule.ig_share_low]
    why: 노출 위치마다 잘리니 상품이 가운데 오게 찍으세요.

  - id: meta.ad.creative_test
    stage: 광고
    label: 크리에이티브 테스트
    kind: next_cycle
    default: 끄기
    next_cycle: [rule.creative_weak, rule.creative_fatigue]
    why: 클릭률이 낮게 나오면 사진 2~3개를 비교해요.

  - id: meta.ad.language
    stage: 광고
    label: 언어 (자동 번역)
    kind: default
    default: 끄기
    why: 국내 손님 대상이면 필요 없어요.

  - id: meta.ad.pixel
    stage: 광고
    label: 추적 – 웹사이트 이벤트 (픽셀)
    kind: default
    default: 없음 (스마트스토어는 설치 불가)
    why: 스마트스토어에는 메타 픽셀을 달 수 없어서 메타 리포트의 '구매'는 비어 있어요. 판매는 스토어 주문으로 확인해요.

  - id: meta.ad.offline_events
    stage: 광고
    label: 추적 – 오프라인 이벤트
    kind: default
    default: 생략
    why: 매장 판매를 연결하는 기능이에요. 온라인 판매만 하면 필요 없어요.

  - id: meta.ad.third_party
    stage: 광고
    label: 타사 보고 (Google 연결)
    kind: default
    default: 생략
    why: 실제 판매는 스토어 주문으로 확인해요. 플랫폼마다 숫자를 세는 방식이 달라요.

  # ── 광고 크리에이티브 ──
  - id: meta.creative.copy
    stage: 광고 크리에이티브
    label: 기본 문구 · 제목
    kind: llm
    ask: 상품의 장점을 한두 마디로 알려 주세요.
    input: text
    default: ""
    next_cycle: [rule.creative_weak, rule.creative_fatigue, rule.click_without_visit]
    why: 알려 주신 장점으로 문구 3개를 써 드려요. 사실이 아닌 말(최저가, 1위 등)은 넣지 않아요.

  - id: meta.creative.cta
    stage: 광고 크리에이티브
    label: 행동 유도 (CTA)
    kind: default
    default: 자세히 보기
    next_cycle: [rule.click_without_visit]
    why: 상품 페이지로 보내면 기본값으로 충분해요.

  - id: meta.creative.per_person_text
    stage: 광고 크리에이티브
    label: 사람마다 문구 최적화
    kind: default
    default: 켜짐 (기본)
    why: 문구를 여러 개 넣으면 사람마다 다르게 보여요. 어떤 문구가 효과였는지 비교하려면 끄고 테스트로 나눠요.

  - id: meta.creative.ai_image
    stage: 광고 크리에이티브
    label: 이미지 생성 (Meta AI)
    kind: next_cycle
    default: 쓰지 않음
    why: 원본 사진과 다르게 보일 수 있어요. 나중에 원본과 비교할 때 써요.

  - id: meta.creative.advantage_enhancements
    stage: 광고 크리에이티브
    label: 어드밴티지+ 개선 사항
    kind: default
    default: 자동으로 켜진 항목 확인 후, 사진이 바뀌는 게 싫으면 끄기
    why: 음악·애니메이션·밝기 조정 같은 항목이 일부 자동으로 켜져 있어요. 모르는 사이 광고가 바뀔 수 있어요.
