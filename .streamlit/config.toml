[server]
headless = true
# push 뒤 바뀐 엔진 모듈(src/engine)도 다시 읽도록 (11/5 예전 모듈이 남아 TypeError 발생)
fileWatcherType = "poll"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# 11/16 사용자 결정: 라이트 모드로 고정. 색은 기획안_개정본_세팅코치.md 5-5 디자인 토큰(라이트 열), WCAG AA 확인값.
# ([theme] 값을 넣으면 Streamlit 1.50은 라이트 고정 사용자 테마가 되어 다크 모드가 꺼짐 — 이번엔 의도한 것)
[theme]
base = "light"
primaryColor = "#2F5D8A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8FA"
textColor = "#2B3340"
font = "Pretendard, 'Noto Sans KR', sans-serif"

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2"
weight = 700
